<template>
  <style>
    /* Kids scene 8 — the ending.

       Adapted from the THIRD act of scenes/flags/close.html (the names). The
       grown-up scene's first two acts — the struck-out deed and the 1823/2023
       legal timeline — are dropped: a 5th grader does not need a court case.

       The frame gets EMPTIER as it goes. One planted flag and one sentence;
       then three names, set large, each with what it was renamed in small
       type under it; then the ceremony strikes them out; then the strikes
       retract and everything the ceremony brought leaves, and the three names
       come back up alone. The last move is still running when the file ends:
       a rule is still drawing under each name, and each name is still coming
       back to full ink.

       One zone on the right carries one object at a time, never two: the flag,
       then the people who said the names, then the flag again, then nothing. */
    #names { position: absolute; inset: 0; overflow: hidden; }
  </style>

  <div id="names" class="chart" data-composition-id="names" data-width="1920" data-height="1080">
  </div>

  <script>
    (function () {
      const S = window.__storyshot;
      const R = Kit.root('names');
      Kit.paper(R, { rose: [1560, 250] });

      const GROUND = 985;

      /* ════ the ground everything stands on ════ */
      const base = Kit.div(null, { position: 'absolute', inset: '0' }, R);

      const shore = Kit.shore(base, 0, GROUND - 150, 1920, 11);
      shore.sea.style.display = 'none';          /* a ground line, not a coast */
      shore.line.style.stroke = 'var(--ink-2)';  /* quiet: it is not the subject */
      shore.line.style.strokeWidth = '3';
      shore.line.setAttribute('pathLength', 1);
      shore.line.style.strokeDasharray = '1';
      shore.line.style.strokeDashoffset = '1';

      /* the one object the whole film has been about */
      const POLE_H = 520;
      const ban = Kit.banner(base, 1480, GROUND - 40 - POLE_H, {
        w: 220, h: 140, poleH: POLE_H, cloth: 'var(--paper-2)',
      });
      ban.fig.style.opacity = 0;
      /* the same green cross it carried in scene 1, at this size */
      Kit.el('path', {
        d: 'M 72 20 V 130 M 24 75 H 120', stroke: 'var(--spain)',
        'stroke-width': 13, fill: 'none',
      }, ban.cloth);

      /* ════ the line that sets up the list ════ */
      const actA = Kit.div(null, { position: 'absolute', inset: '0' }, R);
      const lineA = Kit.text(actA, 'title', 'Every place already had',
        { left: '200px', top: '430px', fontSize: '92px', opacity: 0 });
      const lineB = Kit.text(actA, 'title', 'a name of its own.',
        { left: '200px', top: '528px', fontSize: '92px', opacity: 0 });
      const ul = Kit.underline(actA, 202, 648, lineB.offsetWidth);
      ul.style.transform = 'scaleX(0)';

      const kickA = Kit.kicker(R, 202, 348, 'before you go');
      kickA.style.fontSize = '34px';
      kickA.style.opacity = 0;

      /* ════ the three names ════ */
      const actB = Kit.div(null, { position: 'absolute', inset: '0' }, R);
      const kickB = Kit.kicker(actB, 200, 170, 'the name that was already there');
      kickB.style.fontSize = '34px';
      kickB.style.opacity = 0;

      const NAMES = [
        ['Guanahaní',     'an island, renamed San Salvador'],
        ['Stadacona',     'a town by a river, renamed Quebec'],
        ['Tsenacommacah', 'a whole homeland, renamed Virginia'],
      ];
      const ROW_Y = [280, 505, 730];

      const rows = NAMES.map(([older, under], i) => {
        const y = ROW_Y[i];
        /* the old name is the big one. That is the whole design. */
        const o = Kit.div(null, {
          position: 'absolute', left: '200px', top: y + 'px',
          fontFamily: 'var(--serif)', fontSize: '104px', lineHeight: '1',
          fontWeight: '600', color: 'var(--ink)', whiteSpace: 'nowrap', opacity: 0,
        }, actB);
        o.textContent = older;
        /* what kind of place it is, and the name that was put on top of it:
           smaller, lighter, and plainly worded so a ten-year-old can read it */
        const sub = Kit.div(null, {
          position: 'absolute', left: '206px', top: (y + 134) + 'px',
          fontFamily: 'var(--serif)', fontSize: '38px', lineHeight: '1.2',
          color: 'var(--ink-2)', whiteSpace: 'nowrap', opacity: 0,
        }, actB);
        sub.textContent = under;
        return { o, sub, y };
      });

      /* the strike the ceremony draws, and the rule that comes back after.
         Built after the names exist so each is measured, not guessed. */
      const sv = Kit.el('svg', { viewBox: '0 0 1920 1080', width: 1920, height: 1080 }, actB);
      Object.assign(sv.style, { position: 'absolute', left: '0', top: '0' });
      sv.setAttribute('data-layout-ignore', '');
      rows.forEach((r) => {
        const w = r.o.offsetWidth;
        r.strike = Kit.el('path', {
          d: `M 188 ${r.y + 56} H ${212 + w}`, stroke: 'var(--accent)',
          'stroke-width': 8, 'stroke-linecap': 'round', fill: 'none', pathLength: 1,
          style: 'stroke-dasharray:1;stroke-dashoffset:1',
        }, sv);
        r.ret = Kit.el('path', {
          d: `M 200 ${r.y + 120} H ${200 + w}`, stroke: 'var(--ink)',
          'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none', pathLength: 1,
          style: 'stroke-dasharray:1;stroke-dashoffset:1',
        }, sv);
      });

      /* ════ hundreds of years: one quiet device, and no timeline ════
         People, drawn with the same builder and the same ink as every explorer
         in this film, standing back along the same ground and getting smaller
         the further back they are. They take the flag's place in the frame. */
      const actT = Kit.div(null, { position: 'absolute', inset: '0' }, R);
      const folk = [];
      let px = 1010, py = GROUND;
      for (let i = 0; i < 8; i++) {
        const f = 1 - i * 0.095;
        const h = Math.round(210 * f);
        const p = Kit.person(actT, px, py - h, { h, face: 1, arm: i % 3 === 1 ? 0.3 : 0 });
        p.fig.style.opacity = 0;
        p.op = +(1 - i * 0.085).toFixed(2);
        folk.push(p);
        px += 150 * f;
        py -= 9;
      }
      const taught = Kit.note(actT, 1010, 684, 'each one taught the next', 420);
      taught.style.opacity = 0;

      Kit.credit(R, 150, 1040,
        'Guanahaní (Lucayan) · Stadacona (St Lawrence Iroquoian) · Tsenacommacah (Powhatan)');
      Kit.schem(R, 1664, 1040, 'reconstruction');

      /* ════ timeline ════ */
      const tl = gsap.timeline({ paused: true });

      /* the ground draws itself from the very first frame */
      tl.fromTo(shore.line, { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 1.4, ease: 'none', autoRound: false }, 0);
      tl.fromTo(kickA, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.15);
      /* 0 — the flag is planted on "here is the last thing" */
      tl.fromTo(ban.fig, { opacity: 0, y: -40 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, S.at(0));
      tl.fromTo(ban.st, { phase: 0 }, {
        phase: Math.PI * 2 * 3, duration: S.duration, ease: 'none', onUpdate: ban.redraw,
      }, 0);

      /* 1, 2 — the setup line, one half per phrase */
      tl.fromTo(lineA, { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, S.at(1));
      tl.fromTo(lineB, { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, S.at(2));
      tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power2.out' }, S.at(2, 0.6));

      /* the setup line clears. From here the frame only loses things. */
      tl.fromTo(actA, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: 'power2.in' }, S.at(3) - 0.7);
      tl.fromTo(kickA, { opacity: 1 }, { opacity: 0, duration: 0.35 }, S.at(3) - 0.7);
      tl.fromTo(ban.fig, { opacity: 1 }, { opacity: 0.45, duration: 0.7 }, S.at(3) - 0.6);
      tl.fromTo(kickB, { opacity: 0 }, { opacity: 1, duration: 0.45 }, S.at(3) - 0.25);

      /* 3, 4, 5 — one name at a time, each with what was put on top of it */
      rows.forEach((r, i) => {
        const t = S.at(3 + i);
        tl.fromTo(r.o, { opacity: 0, x: -30 },
          { opacity: 1, x: 0, duration: 0.6, ease: 'expo.out' }, t);
        tl.fromTo(r.sub, { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, t + 0.55);
      });

      /* 6 — people had been saying them for hundreds of years.
             The flag steps out of the frame and the people take its place. */
      tl.fromTo(ban.fig, { opacity: 0.45 }, { opacity: 0, duration: 0.6, ease: 'power2.in' }, S.at(6) - 0.3);
      folk.forEach((p, i) => {
        tl.fromTo(p.fig, { opacity: 0, y: 12 },
          { opacity: p.op, y: 0, duration: 0.45, ease: 'power2.out' }, S.at(6, 0.1 + i * 0.16));
      });
      tl.fromTo(taught, { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, S.at(6, 1.3));

      /* 7 — the ceremony doing its job: the people go, the flag comes back,
             and a seal-red rule strikes each old name out in turn */
      folk.forEach((p, i) => {
        tl.fromTo(p.fig, { opacity: p.op }, { opacity: 0, duration: 0.7, ease: 'power2.in' },
          S.at(7, i * 0.05));
      });
      tl.fromTo(taught, { opacity: 1 }, { opacity: 0, duration: 0.5 }, S.at(7));
      tl.fromTo(ban.fig, { opacity: 0 }, { opacity: 1, duration: 0.6 }, S.at(7, 0.25));
      rows.forEach((r, i) => {
        tl.fromTo(r.strike, { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: 0.8, ease: 'power2.inOut', autoRound: false },
          S.at(7, 0.7 + i * 0.8));
        tl.fromTo(r.o, { opacity: 1 }, { opacity: 0.4, duration: 0.6 }, S.at(7, 1.1 + i * 0.8));
      });

      /* 8, 9 — the turn. Everything the ceremony brought leaves the frame and
             the three names come back up, brighter than anything else in it.
             These moves run longer than the scene's remaining time on purpose:
             at the final frame a rule is still drawing under every name. */
      tl.fromTo(ban.fig, { opacity: 1 }, { opacity: 0, duration: 1.4, ease: 'power2.in' }, S.at(8));
      tl.fromTo(shore.fig, { opacity: 1 }, { opacity: 0, duration: 1.4, ease: 'power2.in' }, S.at(8));

      const BACK = [S.at(8), S.at(8, 0.62), S.at(9)];
      const RET_D = [4.6, 4.3, 4.0];
      rows.forEach((r, i) => {
        const t = BACK[i];
        tl.fromTo(r.strike, { strokeDashoffset: 0 },
          { strokeDashoffset: 1, duration: 1.5, ease: 'power1.in', autoRound: false }, t);
        tl.fromTo(r.sub, { opacity: 1 }, { opacity: 0, duration: 1.0 }, t);
        tl.fromTo(r.o, { opacity: 0.4 }, { opacity: 1, duration: 3.4, ease: 'none' }, t + 0.1);
        tl.fromTo(r.ret, { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: RET_D[i], ease: 'none', autoRound: false }, t + 0.2);
      });

      window.__timelines['names'] = tl;
    })();
  </script>
</template>
