<template>
  <style>
    /* recap: the opening question returns, then one chain grows across the frame, one link per line */
    #recap-field { left: 64px; top: 140px; width: 1792px; height: 728px; }
    #recap-q { position: absolute; left: 0; top: 112px; width: 1920px; text-align: center; font: 700 76px/1 var(--font); color: var(--chalk); white-space: nowrap; }

    /* links sit on one line: centres x = 213, 512, 811, 1109, 1408, 1707; y = 480 */
    .recap-ring { position: absolute; width: 88px; height: 88px; border-radius: 50%; border: 2px dashed rgba(236,235,230,.45); }
    .recap-arrow { position: absolute; top: 479px; width: 24px; height: 3px; background: var(--chalk-2); transform-origin: 0 50%; }
    .recap-arrow::after { content: ''; position: absolute; right: -3px; top: -6.5px; border-left: 13px solid var(--chalk-2); border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
    .recap-lab { position: absolute; top: 650px; width: 290px; margin-left: -145px; text-align: center; white-space: nowrap; }
    .recap-lab b { display: block; font: 600 32px/1.2 var(--font); color: var(--chalk); }
    .recap-lab span { display: block; margin-top: 6px; font: 500 28px/1.2 var(--font); color: var(--chalk-2); }
    .recap-lab span i { font-style: normal; }

    /* 2: Cas9 with its guide RNA, and the same guide as a barcode */
    #recap-cas { position: absolute; left: 385.5px; top: 350px; width: 253px; height: 165px; }
    #recap-cas svg { width: 253px; height: 165px; }
    #recap-rna { left: 406px; top: 411.5px; }
    #recap-rna .nt { font-size: 28px; }   /* the kit's small tiles carry 24 px letters: lift them to the floor */
    #recap-bc { left: 512px; top: 556px; translate: -50% 0; }

    /* 3: a dish of barcoded cells under the drug */
    #recap-dish { position: absolute; left: 686px; top: 355px; width: 250px; height: 250px; border-radius: 50%; background: var(--ground-2); border: 3px solid #4b5466; }
    #recap-dcells { left: 716px; top: 385px; width: 190px; height: 190px; clip-path: circle(116px at 95px 95px); }
    #recap-dcells .cell .bc { opacity: 1; }
    .recap-skin { position: absolute; inset: -2px; border-radius: 50%; background: var(--dead); border: 2px solid #2b2f37; opacity: 0; }
    #recap-drug { position: absolute; inset: 0; pointer-events: none; }
    .recap-p { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--chalk); box-shadow: 0 0 9px rgba(236,235,230,.6); }

    /* 4: read counts per guide: before (outline) and after (filled) */
    #recap-plot { left: 984px; top: 360px; width: 250px; height: 240px; }
    .recap-ob { position: absolute; bottom: 12px; width: 12px; border: 2px solid var(--chalk-2); border-bottom: 0; border-radius: 3px 3px 0 0; transform-origin: 50% 100%; }
    #recap-plot .bar { bottom: 12px; width: 12px; transform-origin: 50% 100%; }

    /* 5: the NF2 clone */
    #recap-clone .cell .bc { opacity: 1; }

    /* 6: the base editor on a short stretch of NF2 */
    #recap-strand { left: 1589px; top: 548px; }
    #recap-strand .nt { position: relative; }
    #recap-strand #recap-T { position: absolute; left: -1.5px; top: -1.5px; width: 44px; height: 56px; box-sizing: border-box; background: #16241e; }
    #recap-editor { position: absolute; left: 0; top: 0; width: 1920px; height: 1px; }
    #recap-cas6 { position: absolute; left: 1581px; top: 372px; width: 253px; height: 165px; }
    #recap-cas6 svg { width: 253px; height: 165px; }
    #recap-deam { position: absolute; left: 1659px; top: 476px; width: 96px; height: 80px; border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, rgba(53,208,127,.42) 0%, rgba(53,208,127,.16) 72%); border: 3px solid var(--edit); }
  </style>

  <div id="recap" class="world" data-composition-id="recap" data-width="1920" data-height="1080">
    <div id="recap-field" class="cellfield" data-layout-allow-overlap></div>
    <div id="recap-rings"></div>

    <div id="recap-arrows"></div>

    <div id="recap-cas"></div>
    <div id="recap-rna" class="strand sm"></div>
    <div id="recap-bc" class="barcode"></div>

    <div id="recap-dish"></div>
    <div id="recap-dcells" class="cellfield" data-layout-allow-overlap></div>
    <div id="recap-drug"></div>

    <div id="recap-plot" class="plot"></div>

    <div id="recap-clone" data-layout-allow-overlap></div>

    <div id="recap-strand" class="strand"></div>
    <div id="recap-editor">
      <div id="recap-cas6"></div>
      <div id="recap-deam"></div>
    </div>

    <div id="recap-l1" class="recap-lab" style="left:213px"><b>细胞</b><span>一个细胞 · 一个基因</span></div>
    <div id="recap-l2" class="recap-lab" style="left:512px"><b>向导 RNA</b><span><i id="recap-l2a">地址</i><i id="recap-l2b"> · 条形码</i></span></div>
    <div id="recap-l3" class="recap-lab" style="left:811px"><b>加药</b><span>维莫非尼 · <i class="num">14</i> 天</span></div>
    <div id="recap-l4" class="recap-lab" style="left:1109px"><b>测序计数</b><span>每条向导的读数</span></div>
    <div id="recap-l5" class="recap-lab" style="left:1408px"><b style="color:var(--nf2)">NF2</b><span>敲掉 → 耐药</span></div>
    <div id="recap-l6" class="recap-lab" style="left:1707px"><b style="color:var(--edit)">碱基编辑器</b><span>C → T · 不剪断</span></div>

    <div id="recap-q">药为什么失效？</div>
    <div class="tag-schematic" data-layout-ignore>示意</div>
    <div id="recap-credit" class="credit" data-layout-ignore>Shalem et al. 2014 · Science</div>
  </div>

  <script>
    (function () {
      const S = window.__storyshot;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const mk = (cls, parent, css = '', html = '') => { const d = document.createElement('div'); d.className = cls; if (css) d.style.cssText = css; if (html) d.innerHTML = html; parent.appendChild(d); return d; };
      const CX = [213, 512, 811, 1109, 1408, 1707], CY = 480;
      const IN = { duration: 0.6, ease: 'expo.out' };

      // ---- phrase 0: the film's first picture again: the field of melanoma cells ----
      const FX = 64, FY = 140;
      const cells = Kit.cells($('#recap-field'), { w: 1792, h: 728, n: 119, r: 38, seed: 11 });
      const PICK = [35, 36, 52, 53, 54, 69, 70];
      const HEX = [[-40, -69], [40, -69], [-80, 0], [0, 0], [80, 0], [-40, 69], [40, 69]];
      const chosen = PICK.map((i) => cells[i]), rest = cells.filter((c, i) => !PICK.includes(i));

      // phrase 1: the question returns
      tl.fromTo('#recap-q', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: 'expo.out' }, S.at(1));
      tl.fromTo(cells.map((c) => c.el), { opacity: 1 }, { opacity: 0.3, duration: 0.6 }, S.at(1));

      // phrase 2: the field gathers into the first link: a few cells
      tl.fromTo(rest.map((c) => c.el), { opacity: 0.3 }, { opacity: 0, duration: 0.5 }, S.at(2));
      chosen.forEach((c, k) => {
        const tx = CX[0] + HEX[k][0], ty = CY + HEX[k][1];
        tl.fromTo(c.el, { opacity: 0.3 }, { opacity: 1, duration: 0.5 }, S.at(2, 0.1));
        tl.fromTo(c.el, { x: 0, y: 0, scale: 1 }, { x: tx - (FX + c.x), y: ty - (FY + c.y), scale: 36 / c.r, duration: 1.0, ease: 'power3.inOut' }, S.at(2, 0.05 + k * 0.04));
      });

      // phrase 3: each cell its own small experiment
      const rings = HEX.map(([dx, dy]) => mk('recap-ring', $('#recap-rings'), `left:${CX[0] + dx - 44}px;top:${CY + dy - 44}px`));
      rings.forEach((r, k) => tl.fromTo(r, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'expo.out' }, S.at(3, k * 0.09)));
      tl.fromTo('#recap-l1 b', { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...IN }, S.at(3, 0.3));

      // phrase 4: each one knocks out one gene: a guide (barcode) inside every cell
      chosen.forEach((c, k) => tl.fromTo(c.el.querySelector('.bc'), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: 'expo.out' }, S.at(4, k * 0.1)));
      tl.fromTo('#recap-l1 span', { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...IN }, S.at(4, 0.4));

      // arrows between links
      // centred in the gaps between the drawn objects
      const arrows = [362.75, 662.25, 960, 1269, 1546.5].map((x) => mk('recap-arrow', $('#recap-arrows'), `left:${x - 18}px`));
      const arrow = (k, t) => tl.fromTo(arrows[k], { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: 'power2.out' }, t);

      // phrase 5: the guide is the scissors' address: Cas9 carrying its guide RNA
      $('#recap-cas').innerHTML = Kit.CAS9_SVG;
      const rna = Kit.strand($('#recap-rna'), 'ACCUCU', {}, 'rna');
      arrow(0, S.at(5));
      tl.fromTo('#recap-cas', { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: 'expo.out' }, S.at(5, 0.15));
      rna.forEach((t, k) => tl.fromTo(t, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out' }, S.at(5, 0.5 + k * 0.07)));
      tl.fromTo('#recap-l2 b', { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...IN }, S.at(5, 0.5));
      tl.fromTo('#recap-l2a', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(5, 0.8));

      // phrase 6: ... and the cell's barcode: the same guide drops out as a barcode chip
      Kit.barcode($('#recap-bc'), 3, 14);
      tl.fromTo('#recap-bc', { opacity: 0, y: -120, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: 'expo.out' }, S.at(6));
      tl.fromTo('#recap-l2b', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(6, 0.4));
      tl.fromTo(chosen.map((c) => c.el.querySelector('.bc')), { scaleY: 1 }, { scaleY: 1.8, duration: 0.25, yoyo: true, repeat: 1, ease: 'power1.inOut' }, S.at(6, 0.5));

      // phrase 7: the drug lets the cells choose: most die, a few keep going
      const dc = Kit.cells($('#recap-dcells'), { w: 190, h: 190, n: 16, r: 22, seed: 4 });
      const SURV = [5, 10];
      dc.forEach((c) => { const s = document.createElement('div'); s.className = 'recap-skin'; c.el.appendChild(s); c.skin = s; });
      arrow(1, S.at(7));
      tl.fromTo('#recap-dish', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'expo.out' }, S.at(7, 0.1));
      dc.forEach((c, k) => tl.fromTo(c.el, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'expo.out' }, S.at(7, 0.25 + k * 0.02)));
      tl.fromTo('#recap-l3 b', { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...IN }, S.at(7, 0.3));
      tl.fromTo(['#recap-l3 span', '#recap-credit'], { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(7, 0.6));
      const rnd = Kit.rng(9), drug = $('#recap-drug'), parts = [];
      for (let k = 0; k < 16; k++) {
        const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * 100, x = 811 + Math.cos(a) * rr, y = 480 + Math.sin(a) * rr;
        const p = mk('recap-p', drug, `left:${x - 5}px;top:${y - 5}px`); parts.push(p);
        tl.fromTo(p, { opacity: 0, y: -(y - 300) }, { opacity: 0.9, y: 0, duration: 0.6, ease: 'power2.out' }, S.at(7, 0.55 + rnd() * 0.5));
      }
      dc.forEach((c, k) => {
        if (SURV.includes(k)) return;
        const d = 1.0 + rnd() * 0.7;
        tl.fromTo(c.skin, { opacity: 0 }, { opacity: 1, duration: 0.4 }, S.at(7, d));
        tl.fromTo(c.el, { scale: 1 }, { scale: 0.66, duration: 0.5, ease: 'power2.out' }, S.at(7, d));
      });
      tl.fromTo(parts, { opacity: 0.9 }, { opacity: 0, duration: 0.4 }, S.at(8, 0.2));

      // phrase 8: sequence and count the barcodes: before (outline) vs after (filled), per guide
      const plot = $('#recap-plot');
      const BEFORE = [92, 104, 86, 98, 110, 90, 96, 100, 88, 106, 94, 102];
      const AFTER = [38, 16, 186, 52, 0, 30, 168, 60, 22, 0, 200, 34];
      const TALL = [2, 6, 10];
      const ob = [], fb = [];
      BEFORE.forEach((h, i) => {
        const x = 21 + i * 18;
        ob.push(mk('recap-ob', plot, `left:${x}px;height:${h}px`));
        fb.push(mk('bar', plot, `left:${x}px;height:${AFTER[i]}px`));
      });
      arrow(2, S.at(8));
      tl.fromTo(plot, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, S.at(8, 0.1));
      tl.fromTo(ob, { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: 'power2.out', stagger: 0.03 }, S.at(8, 0.35));
      tl.fromTo(fb, { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: 'expo.out', stagger: 0.04 }, S.at(8, 0.9));
      tl.fromTo('#recap-l4 b', { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...IN }, S.at(8, 0.3));
      tl.fromTo('#recap-l4 span', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(8, 0.7));

      // phrase 9: and you know who kept the cancer cells alive: NF2 (its bars, its surviving cells, its clone)
      const AMBER = '#f4a62a';
      arrow(3, S.at(9));
      tl.fromTo(TALL.map((i) => fb[i]), { backgroundColor: '#8d93a0' }, { backgroundColor: AMBER, duration: 0.4 }, S.at(9, 0.1));
      SURV.forEach((k) => {
        tl.fromTo(dc[k].el, { borderColor: '#4b5466' }, { borderColor: AMBER, duration: 0.4 }, S.at(9, 0.3));
        tl.fromTo(dc[k].el.querySelector('.bc'), { backgroundColor: '#ff5c8a' }, { backgroundColor: AMBER, duration: 0.4 }, S.at(9, 0.3));
      });
      const clone = $('#recap-clone');
      const CL = [[0, -12, 58], [-70, 72, 34], [70, 72, 34]].map(([dx, dy, r]) =>
        mk('cell nf2', clone, `left:${CX[4] + dx - r}px;top:${CY + dy - r}px;width:${2 * r}px;height:${2 * r}px`, '<div class="nuc"></div><div class="bc"></div>'));
      tl.fromTo(CL[0], { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'expo.out' }, S.at(9, 0.5));
      tl.fromTo([CL[1], CL[2]], { opacity: 0, scale: 0, x: (i) => (i ? -70 : 70), y: -84 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.6, ease: 'expo.out', stagger: 0.15 }, S.at(9, 1.3));
      tl.fromTo('#recap-l5 b', { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...IN }, S.at(9, 0.6));
      tl.fromTo('#recap-l5 span', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(9, 1.0));

      // phrase 10: to ask about one particular mutation: one base of NF2 (the C the base scene edits)
      const st = Kit.strand($('#recap-strand'), 'CTCTT', { 2: 'ins' });   // NF2 exon 2 indexes 21-25; tile 2 = index 23
      const T = document.createElement('span'); T.id = 'recap-T'; T.className = 'nt edit'; T.textContent = 'T'; st[2].appendChild(T);
      arrow(4, S.at(10));
      st.forEach((t, k) => tl.fromTo(t, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, S.at(10, 0.2 + k * 0.06)));
      tl.fromTo(T, { opacity: 0, scale: 0.75 }, { opacity: 0, scale: 0.75, duration: 0.01 }, 0);

      // phrase 11: swap in an editor that changes just one base: C becomes T, no cut
      $('#recap-cas6').innerHTML = Kit.CAS9_SVG;
      tl.fromTo('#recap-editor', { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.7, ease: 'expo.out' }, S.at(11));
      tl.fromTo('#recap-l6 b', { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...IN }, S.at(11, 0.3));
      tl.fromTo('#recap-deam', { scale: 1 }, { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: 'power1.inOut' }, S.at(11, 0.8));
      tl.fromTo(T, { opacity: 0, scale: 0.75 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'expo.out' }, S.at(11, 1.1));
      tl.fromTo('#recap-l6 span', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(11, 1.3));

      // The last beat. Until here the recap has only added, and its final frame — six stations, six
      // labels, every object the film ever drew — is the fullest of the whole video, held still until
      // the file stops. So let it go, slowly, right through the tail: the chain dissolves and what is
      // left is the question the film opened with and the thing that answers it, one gene knocked out
      // and the cells that lived through the drug because of it.
      tl.fromTo(['#recap-field', '#recap-rings', '#recap-arrows', '#recap-cas', '#recap-rna',
        '#recap-bc', '#recap-dish', '#recap-dcells', '#recap-drug', '#recap-plot', '#recap-strand',
        '#recap-editor', '#recap-l1', '#recap-l2', '#recap-l3', '#recap-l4', '#recap-l6', '#recap-credit'],
        { opacity: 1 }, { opacity: 0, duration: 1.5, ease: 'power1.inOut' }, S.duration - 2.1);

      window.__timelines['recap'] = tl;
    })();
  </script>
</template>
