  <script>
    (function () {
      const S = window.__storyshot, A = (k, o = 0) => S.at(k) + (o || 0);
      const q = (s) => document.querySelector(s);
      const NEU = { color: '#ecebe6', borderColor: 'rgba(236,235,230,.18)', backgroundColor: 'rgba(236,235,230,.06)' };
      const GUI = { color: '#ff5c8a', borderColor: '#ff5c8a', backgroundColor: 'rgba(255,92,138,.10)' };
      const PAM = { color: '#4fd1e0', borderColor: '#4fd1e0', backgroundColor: 'rgba(79,209,224,.10)' };

      /* ---- the strand from the previous scene: NF2 exon 2, indexes 10-43 (34 tiles) ---- */
      const seq = Kit.NF2.exon2.slice(10, 44);          // exon index 10 + i  ==  tile i
      const tiles = Kit.strand(q('#base-strand'), seq, { 13: 'ins' });   // tile 13 = exon index 23, the C
      const GS = Kit.NF2.guideStart - 10, GE = GS + Kit.NF2.guide.length - 1;   // tiles 9..28
      const PS = Kit.NF2.pamStart - 10, PE = PS + Kit.NF2.pam.length - 1;       // tiles 29..31
      const target = tiles[Kit.NF2.guideStart - 10 + 4];                 // protospacer position 5
      const guideTiles = tiles.slice(GS, GE + 1).filter((t) => t !== target), pamTiles = tiles.slice(PS, PE + 1);
      const editT = q('#base-editT');

      /* ---- Cas9, scaled so the DNA channel sits on the strand's centre line ---- */
      q('#base-cas').innerHTML = Kit.CAS9_SVG;
      const casSvg = q('#base-cas svg');
      casSvg.setAttribute('width', 598); casSvg.setAttribute('height', 390);

      /* ---- act 2: guides tiled along one gene, each leaving one edit ---- */
      const NG = 32, GX = 180, GW = 1560, pitch = GW / NG;
      const ticks = [], dots = [];
      const tickBox = q('#base-tick');
      for (let i = 0; i < NG; i++) {
        const t = document.createElement('i'); t.className = 'tick';
        t.style.left = (GX + i * pitch + 4).toFixed(1) + 'px'; tickBox.appendChild(t); ticks.push(t);
        const d = document.createElement('i'); d.className = 'dot';
        d.style.left = (GX + i * pitch + 16).toFixed(1) + 'px'; tickBox.appendChild(d); dots.push(d);
      }
      Kit.barcode(q('#base-bc'), 31, 12);

      /* ---- act 2: read counts per position (schematic, seeded; a few positions stand out) ---- */
      const rndBar = Kit.rng(2021), tall = { 6: 248, 17: 288, 25: 209 }, bars = [], plot = q('#base-plot');
      for (let i = 0; i < NG; i++) {
        const h = tall[i] ?? 14 + Math.round(rndBar() * 56);
        const b = document.createElement('i'); b.className = 'bar' + (tall[i] ? ' hi' : '');
        b.style.cssText = `left:${(i * pitch + 9).toFixed(1)}px;width:30px;height:0px;` +
          (tall[i] ? 'background:#35d07f;box-shadow:0 0 14px rgba(53,208,127,.35)' : 'opacity:.7');
        plot.appendChild(b); bars.push({ el: b, h });
      }

      /* ---- act 3: BRCA1's 13 exons, and one variant chip going in ---- */
      const exons = [], exBox = q('#base-exons');
      for (let i = 0; i < 13; i++) {
        const e = document.createElement('i'); e.className = 'exon';
        e.style.left = (190 + i * 120) + 'px'; exBox.appendChild(e); exons.push(e);
      }
      Kit.strand(q('#base-chip'), 'TAGCT', { 2: 'edit' });

      /* ---- act 3: 3,893 single-base changes as one SVG, three paths (colours 示意) ---- */
      (function heatmap() {
        const bands = [163, 163, 162, 162, 162, 162, 162, 162];   // 1,298 positions x 3 other bases = 3,894 - 1
        const cell = 8, px = 9.57, py = 9.57, gap = 13, N = 3893;
        const rnd = Kit.rng(3893), buck = { ok: [], mid: [], lof: [] };
        let n = 0, y0 = 0;
        for (let b = 0; b < bands.length; b++) {
          for (let r = 0; r < 3; r++) for (let c = 0; c < bands[b]; c++) {
            if (n >= N) continue;
            n++;
            const x = (c * px).toFixed(1), y = (y0 + r * py).toFixed(1), v = rnd();
            buck[v < 0.20 ? 'lof' : v < 0.32 ? 'mid' : 'ok'].push(`M${x} ${y}h${cell}v${cell}h-${cell}z`);
          }
          y0 += 3 * py + gap;
        }
        const W = Math.round((bands[0] - 1) * px + cell), H = Math.round((bands.length - 1) * (3 * py + gap) + 2 * py + cell);
        q('#base-hm-clip').innerHTML =
          `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">` +
          `<path d="${buck.ok.join('')}" fill="#35d07f" fill-opacity=".8"/>` +
          `<path d="${buck.mid.join('')}" fill="#8d93a0" fill-opacity=".75"/>` +
          `<path d="${buck.lof.join('')}" fill="#ff5a4e" fill-opacity=".8"/></svg>`;
        q('#base-hm-clip').dataset.w = W;
      })();

      /* ================= timeline ================= */
      const tl = gsap.timeline({ paused: true });

      /* 0 想问某一个突变 — the amber C from the previous scene is marked */
      tl.fromTo('#base-target', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(0));
      tl.fromTo(target, { scale: 1 }, { scale: 1.14, duration: 0.45, yoyo: true, repeat: 1, ease: 'sine.inOut' }, A(0));

      /* 1 可以换一种工具 — the strand settles lower, the protein arrives */
      tl.fromTo('#base-dna', { y: 0 }, { y: 130, duration: 0.7, ease: 'expo.out' }, A(1));
      tl.fromTo('#base-target', { opacity: 1 }, { opacity: 0, duration: 0.35 }, A(1, 0.45));
      tl.fromTo('#base-editor', { opacity: 0, y: -210 }, { opacity: 1, y: 0, duration: 0.7, ease: 'expo.out' }, A(1, 0.2));

      /* 2 碱基编辑器 — the green deaminase, attached, named */
      tl.fromTo('#base-deam', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.6)' }, A(2));
      tl.fromTo('#base-cas-leader path', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: 'none', autoRound: false }, A(2, 0.25));
      tl.fromTo('#base-cas-leader', { opacity: 0 }, { opacity: 1, duration: 0.1 }, A(2, 0.25));
      tl.fromTo('#base-cas-label', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, A(2, 0.3));

      /* 3 它不把 DNA 剪断 — the same guide pairs, the PAM lights, and nothing is cut */
      tl.fromTo('#base-guide-label', { opacity: 0 }, { opacity: 1, duration: 0.4 }, A(3));
      tl.fromTo(guideTiles, NEU, { ...GUI, duration: 0.3, stagger: 0.03 }, A(3));
      tl.fromTo('#base-nocut', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.5)' }, A(3, 0.5));
      tl.fromTo(pamTiles, NEU, { ...PAM, duration: 0.3, stagger: 0.06 }, A(3, 0.85));
      tl.fromTo('#base-pam-label', { opacity: 0 }, { opacity: 1, duration: 0.35 }, A(3, 1));

      /* 4 而是把一个 C 直接改成 T — the editing window, then the base itself */
      tl.fromTo('#base-tag', { opacity: 0 }, { opacity: 1, duration: 0.4 }, A(4));
      tl.fromTo('#base-cas', { opacity: 1 }, { opacity: 0.22, duration: 0.5 }, A(4));
      tl.fromTo('#base-cas svg text', { opacity: 1 }, { opacity: 0, duration: 0.4 }, A(4));
      tl.fromTo('#base-win', { opacity: 0, scaleX: 1.1 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: 'expo.out' }, A(4));
      tl.fromTo('#base-win-label', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, A(4, 0.1));
      tl.fromTo(editT, { opacity: 0, scale: 0.75 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'expo.out' }, A(4, 0.85));
      tl.fromTo('#base-ct-leader', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: 'expo.out' }, A(4, 1));
      tl.fromTo('#base-ct', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, A(4, 1.1));

      /* 5 把向导铺满一个基因 — the site goes, the whole gene comes */
      tl.fromTo('#base-act1', { opacity: 1 }, { opacity: 0, duration: 0.4 }, A(5));
      tl.fromTo('#base-gene', { opacity: 0, scaleX: 0.06 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: 'expo.out' }, A(5, 0.3));
      tl.set('#base-gene', { transformOrigin: 'left center' }, 0);
      tl.fromTo('#base-gene-label', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.45, ease: 'expo.out' }, A(5, 0.55));
      ticks.forEach((t, i) => tl.fromTo(t, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.35, ease: 'expo.out' }, A(5, 0.75) + i * 0.02));
      tl.fromTo('#base-tick-label', { opacity: 0 }, { opacity: 1, duration: 0.4 }, A(5, 1.0));

      /* 6 每条向导做出一个点突变 — one green dot per guide */
      dots.forEach((d, i) => tl.fromTo(d, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'expo.out' }, A(6) + i * 0.028));
      tl.fromTo('#base-dot-label', { opacity: 0 }, { opacity: 1, duration: 0.4 }, A(6, 0.5));

      /* 7-10 加药，测序，数条形码，和刚才一样 — the gene makes room, then the same pipeline */
      tl.fromTo(['#base-gene', '#base-gene-label', '#base-tick', '#base-tick-label', '#base-dot-label'],
        { y: 130 }, { y: 0, duration: 0.7, ease: 'expo.out' }, A(7, -0.35));
      tl.fromTo(['#base-n1', '#base-n1l'], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, A(7));
      tl.fromTo('#base-a1', { opacity: 0 }, { opacity: 1, duration: 0.3 }, A(8, -0.15));
      tl.fromTo(['#base-n2', '#base-n2l'], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, A(8));
      tl.fromTo('#base-a2', { opacity: 0 }, { opacity: 1, duration: 0.3 }, A(9, 0.1));
      tl.fromTo(['#base-n3', '#base-n3l'], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, A(9, 0.25));
      tl.fromTo('#base-bc', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'expo.out' }, A(9, 0.4));
      tl.fromTo(['#base-n1', '#base-n2', '#base-n3'], { borderColor: '#2b313d' }, { borderColor: '#8d93a0', duration: 0.5, stagger: 0.08 }, A(10));

      /* 11 2021 年 — whose experiment this is */
