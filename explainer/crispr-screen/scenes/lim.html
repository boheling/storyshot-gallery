  <script>
    (function () {
      const S = window.__storyshot, K = window.Kit;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const E = 'expo.out';
      const IN = { opacity: 0 }, ON = { opacity: 1 };
      const fadeIn = (sel, t, from = {}, d = 0.6) => tl.fromTo(sel, { ...IN, ...from }, { ...ON, x: 0, y: 0, scale: 1, duration: d, ease: E }, t);
      const fadeOut = (sel, t, to = {}, d = 0.35) => tl.fromTo(sel, { ...ON }, { opacity: 0, duration: d, ease: 'power2.in', ...to }, t);

      // ---------------- the index: 1 2 3 land, then each lights as its limit starts
      const IDLE = { backgroundColor: 'rgba(236,235,230,0)', color: '#8d93a0', borderColor: '#8d93a0' };
      const LIT = { backgroundColor: '#ecebe6', color: '#0f1218', borderColor: '#ecebe6' };
      tl.fromTo(['#lim-i1', '#lim-i2', '#lim-i3'], { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.55, ease: E, stagger: 0.14 }, S.at(0, 0.2));
      const light = (k, t) => {
        tl.fromTo(`#lim-i${k}`, IDLE, { ...LIT, duration: 0.35, ease: 'power2.out' }, t);
        fadeIn(`#lim-t${k}`, t + 0.1, { x: -16 }, 0.5);
        if (k > 1) { tl.fromTo(`#lim-i${k - 1}`, LIT, { ...IDLE, duration: 0.3 }, t); fadeOut(`#lim-t${k - 1}`, t, {}, 0.25); }
      };
      light(1, S.at('第一'));
      light(2, S.at('第二'));
      light(3, S.at('第三'));

      // ---------------- (1) the codon row: NF2 codons 46-56 (Kit.NF2.wt), then codon 50 is lost (Kit.NF2.del3)
      const cods = K.codons($('#lim-row'), K.NF2.wt.slice(0, 11));
      cods.forEach((c) => c.querySelector('.no').setAttribute('data-layout-ignore', ''));
      // after the deletion, codons 51-56 are numbered 50-55, as Kit.NF2.del3 numbers them
      const del3 = K.NF2.del3;
      const no2 = cods.slice(5).map((c, k) => {
        const d = document.createElement('div');
        d.className = 'no lim-no2'; d.setAttribute('data-layout-ignore', '');
        d.textContent = del3[4 + k] ? del3[4 + k][0] : 50 + k;
        c.appendChild(d); return d;
      });
      const left = cods.slice(0, 5), right = cods.slice(5, 10), lost = cods[4];
      tl.fromTo('#lim-row, #lim-nf2', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0);
      tl.fromTo('#lim-rowbox', { y: 110 }, { y: 0, duration: 0.7, ease: E }, S.at('蛋白只少', -0.1));
      tl.fromTo(cods[10], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(no2, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      // the cut: between codon 50 and 51 (exon index 35 | 36), the halves part
      const tCut = S.at('剪断不等于');
      tl.fromTo('#lim-cut', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.35, ease: 'power3.out' }, tCut);
      tl.fromTo('#lim-burst', { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.5, duration: 0.6, ease: 'power2.out', immediateRender: false }, tCut + 0.1);
      tl.fromTo(left, { x: 0 }, { x: -14, duration: 0.5, ease: E }, tCut + 0.15);
      tl.fromTo(right, { x: 0 }, { x: 14, duration: 0.5, ease: E }, tCut + 0.15);

      // three bases lost: codon 50 (GTG) turns red and lifts out, the gap closes, the frame holds
      const tDel = S.at('少掉三个');
      tl.fromTo(lost.querySelector('.b3'), { color: '#ecebe6', borderColor: 'rgba(236,235,230,0.18)', backgroundColor: 'rgba(236,235,230,0.06)' },
        { color: '#ff5a4e', borderColor: '#ff5a4e', backgroundColor: 'rgba(255,90,78,0.12)', duration: 0.25 }, tDel);
      tl.fromTo(lost.querySelector('.aa'), { color: '#8d93a0' }, { color: '#ff5a4e', duration: 0.25 }, tDel);
      tl.fromTo(lost, { y: 0, opacity: 1 }, { y: -150, opacity: 0.55, duration: 0.6, ease: E }, tDel + 0.3);
      fadeOut('#lim-cut', tDel + 0.3, {}, 0.25);
      tl.fromTo(left.slice(0, 4), { x: -14 }, { x: 0, duration: 0.6, ease: E }, tDel + 0.6);
      tl.fromTo(right, { x: 14 }, { x: -128, duration: 0.7, ease: E }, tDel + 0.6);
      tl.fromTo(cods[10], { opacity: 0, x: 0 }, { opacity: 1, x: -128, duration: 0.7, ease: E }, tDel + 0.6);
      tl.fromTo(cods.slice(5).map((c) => c.querySelector('.no:not(.lim-no2)')), { opacity: 1 }, { opacity: 0, duration: 0.3 }, tDel + 1.1);
      tl.fromTo(no2, { opacity: 0 }, { opacity: 1, duration: 0.4 }, tDel + 1.2);

      // the frame holds: a reader runs 46 -> 55 and every amino acid reads as before
      const tRead = S.at('读法没乱'), order = [0, 1, 2, 3, 5, 6, 7, 8, 9, 10];
      tl.fromTo('#lim-reader', { opacity: 0, x: 0 }, { opacity: 1, duration: 0.2 }, tRead);
      tl.fromTo('#lim-reader', { x: 0 }, { x: 9 * 128, duration: 1.1, ease: 'power1.inOut' }, tRead + 0.1);
      tl.fromTo(order.map((i) => cods[i].querySelector('.aa')), { color: '#8d93a0' }, { color: '#ecebe6', duration: 0.2, stagger: 0.12 }, tRead + 0.1);
      fadeOut('#lim-reader', tRead + 1.3, {}, 0.3);
      tl.fromTo(lost, { opacity: 0.55 }, { opacity: 0.3, duration: 0.4 }, tRead + 1.3);

      // the protein: 595 vs 594 amino acids, one lost at position 50
      const tPro = S.at('蛋白只少');
      fadeIn('#lim-bl1', tPro, { y: 16 }, 0.5);
      tl.fromTo('#lim-b1', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: E }, tPro + 0.05);
      fadeIn('#lim-bl2', tPro + 0.4, { y: 16 }, 0.5);
      tl.fromTo('#lim-b2', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: E }, tPro + 0.45);
      tl.fromTo('#lim-notch', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: 'back.out(2)' }, tPro + 0.9);
      // ... and it may still work
      tl.fromTo('#lim-checkp', { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out', autoRound: false }, S.at('照样能用'));
      fadeOut('#lim-d1', S.at('第二'), { y: -24 }, 0.35);

      // ---------------- (2) an amplified region: one guide cuts every copy; the cell stops
      const t2 = S.at('第二', 0.4);
      fadeIn('#lim-c2', t2, { scale: 0.8 }, 0.6);
      fadeIn('#lim-c2lab', t2 + 0.2, { y: 12 }, 0.5);
      fadeIn('#lim-panel', t2 + 0.15, { x: 30 }, 0.6);
      fadeIn('#lim-wedge', t2 + 0.3, {}, 0.5);
      tl.fromTo('#lim-chr', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: E }, t2 + 0.35);

      const tHarm = S.at('本身就有伤害', 0.35);
      tl.fromTo('#lim-chrcut', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: 'power3.out' }, tHarm);
      tl.fromTo('#lim-chrburst', { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.6, ease: 'power2.out', immediateRender: false }, tHarm + 0.05);
      fadeIn('#lim-harm', tHarm + 0.3, { x: -12 }, 0.5);

      // the region is there many times over: copies stack under it
      const tAmp = S.at('复制了很多份');
      const copies = [];
      for (let k = 0; k < 9; k++) {
        const c = document.createElement('div');
        c.id = `lim-copy${k}`; c.className = 'lim-copy'; c.style.top = `${180 + 50 * k}px`;
        c.innerHTML = '<div class="lim-half l lim-bands"></div><div class="lim-half r lim-bands"></div>';
        $('#lim-copies').appendChild(c); copies.push(c);
      }
      fadeOut('#lim-harm', tAmp, {}, 0.3);
      fadeIn('#lim-cr2', tAmp, {}, 0.4);
      fadeIn('#lim-reg', tAmp, { scale: 1.08 }, 0.5);
      copies.forEach((c, k) => tl.fromTo(c, { opacity: 0, y: -(80 + 50 * k) }, { opacity: 1, y: 0, duration: 0.55, ease: E }, tAmp + 0.3 + 0.16 * k));
      fadeIn('#lim-amp', tAmp + 0.9, { x: -14 }, 0.5);
      fadeIn('#lim-ampsub', tAmp + 1.1, { x: -14 }, 0.5);

      // one guide, a cut on every copy
      const tMany = S.at('很多个断口');
      fadeIn('#lim-guide', tMany, { y: -20, scale: 0.8 }, 0.5);
      tl.fromTo('#lim-vline', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.6, ease: 'power2.out' }, tMany + 0.35);
      const ccuts = copies.map((c, k) => {
        const m = document.createElement('div');
        m.id = `lim-ccut${k}`; m.className = 'lim-ccut'; m.style.top = `${180 + 50 * k - 4}px`;
        $('#lim-ccuts').appendChild(m); return m;
      });
      ccuts.forEach((m, k) => {
        const t = tMany + 0.5 + 0.11 * k, [l, r] = copies[k].children;
        tl.fromTo(m, { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: 'back.out(2.5)' }, t);

        tl.fromTo(r, { x: 0 }, { x: 7, duration: 0.4, ease: E }, t);
      });

      // the cell stops growing: grey, it shrinks
      const tStop = S.at('停止生长');
      tl.fromTo('#lim-c2dead', { opacity: 0 }, { opacity: 1, duration: 0.7, ease: 'power2.out' }, tStop);

      // whatever the target is, the same: the tag flips, the cell stays grey
      const tAny = S.at('什么基因无关');
      fadeIn('#lim-tgt1', tAny, { x: -16 }, 0.5);
      fadeOut('#lim-tgt1', tAny + 0.9, {}, 0.25);
      fadeIn('#lim-tgt2', tAny + 1.0, { y: 14 }, 0.45);
      fadeOut('#lim-d2', S.at('第三'), { y: -24 }, 0.35);
      fadeOut('#lim-cr2', S.at('第三'), {}, 0.3);

      // ---------------- (3) the cut lights p53; the cell pauses
      const t3 = S.at('第三', 0.35);
      fadeIn('#lim-pa', t3, { scale: 0.82 }, 0.6);
      fadeIn('#lim-ringa', t3 + 0.1, { scale: 0.9 }, 0.6);
      const tP = S.at('激活');
      tl.fromTo('#lim-ringa', { rotation: 0 }, { rotation: 230, duration: tP + 1.0 - t3, ease: 'none' }, t3);
      tl.fromTo('#lim-ringa', { rotation: 230 }, { rotation: 262, duration: 0.5, ease: 'power2.out', immediateRender: false }, tP + 1.0);
      // the cut
      tl.fromTo('#lim-pagap', { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: 'power3.out' }, tP);
      tl.fromTo(['#lim-pal1', '#lim-pal2'], { x: 0 }, { x: -7, duration: 0.4, ease: E }, tP);
      tl.fromTo(['#lim-par1', '#lim-par2'], { x: 0 }, { x: 7, duration: 0.4, ease: E }, tP);
      fadeIn('#lim-cr3', tP, {}, 0.4);
      // ... lights p53
      tl.fromTo('#lim-parrowp', { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.45, ease: 'power2.out', autoRound: false }, tP + 0.35);
      tl.fromTo('#lim-pap53', { backgroundColor: 'rgba(236,235,230,0)', color: '#8d93a0', borderColor: '#4b5466', boxShadow: '0 0 0px 0px rgba(236,235,230,0)' },
        { backgroundColor: '#ecebe6', color: '#0f1218', borderColor: '#ecebe6', boxShadow: '0 0 34px 6px rgba(236,235,230,0.45)', duration: 0.4, ease: 'power2.out' }, tP + 0.75);
      // ... and the cell cycle pauses
      fadeIn('#lim-pause', tP + 1.3, { scale: 0.4 }, 0.5);
      fadeIn('#lim-pauselab', tP + 1.45, { x: -14 }, 0.5);

      // p53-normal vs p53 lost: the second cell is cut too, but keeps cycling and divides
      const tN = S.at('p53 正常');
      tl.fromTo('#lim-ga', { x: 360 }, { x: 0, duration: 0.7, ease: E }, tN);
      fadeIn('#lim-laba', tN + 0.2, { y: 12 }, 0.5);
      fadeIn('#lim-pb', tN + 0.25, { scale: 0.8 }, 0.6);
      fadeIn('#lim-ringb', tN + 0.3, { scale: 0.9 }, 0.6);
      fadeIn('#lim-labb', tN + 0.45, { y: 12 }, 0.5);
      tl.fromTo('#lim-pbgap', { opacity: 0 }, { opacity: 1, duration: 0.2 }, tN + 0.7);
      tl.fromTo('#lim-pbgap', { opacity: 1 }, { opacity: 0, duration: 0.4 }, tN + 1.3);
      const tDiv = S.at('更不容易');
      tl.fromTo('#lim-ringb', { rotation: 0 }, { rotation: 300, duration: tDiv + 0.3 - (tN + 0.3), ease: 'none' }, tN + 0.3);
      fadeOut('#lim-ringb', tDiv + 0.1, {}, 0.3);
      fadeOut('#lim-pbp53', tDiv, {}, 0.2);
      // B divides into four
      const C = [[1290, 400], [1510, 400], [1290, 620], [1510, 620]];
      tl.fromTo('#lim-pb', { x: 0, y: 0, scale: 1 }, { x: C[0][0] - 1400, y: C[0][1] - 510, scale: 200 / 340, duration: 0.6, ease: E }, tDiv + 0.15);
      C.slice(1).forEach(([cx, cy], k) => {
        const d = document.createElement('div');
        d.id = `lim-dau${k}`; d.className = 'lim-bigcell lim-dau';
        d.style.left = `${cx - 100}px`; d.style.top = `${cy - 100}px`;
        d.innerHTML = '<div class="lim-nucl" style="left:50px;top:50px;width:100px;height:100px"><div class="lim-dna" style="left:10px;top:44px;width:80px;height:4px"></div><div class="lim-dna" style="left:10px;top:54px;width:80px;height:4px"></div></div>';
        $('#lim-daus').appendChild(d);
        tl.fromTo(d, { opacity: 0, x: 1400 - cx, y: 510 - cy, scale: 0.4 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.65, ease: E }, tDiv + 0.2 + 0.12 * k);
      });

      window.__timelines['lim'] = tl;
    })();
  </script>
