  <script>
    (function () {
      const S = window.__storyshot;
      const INK = '#16181d', SOFT = 'rgba(22,24,29,.045)';
      const CTRL = '#8a8578', LINE = '#d9d4c7', IMM = '#0f766e';

      // ---- the four organs, drawn as flat ink line art --------------------------------------
      function organSvg(kind, size) {
        const o = 'fill="' + SOFT + '" stroke="' + INK + '" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
        const l = 'fill="none" stroke="' + INK + '" stroke-width="3.5" stroke-linecap="round"';
        const body = {
          lung: '<path d="M50 8 V30" ' + l + '/><path d="M50 30 L34 42 M50 30 L66 42" ' + l + '/>' +
            '<path d="M34 42 C 18 50, 12 70, 16 86 C 18 95, 40 97, 44 84 C 48 68, 46 50, 34 42 Z" ' + o + '/>' +
            '<path d="M66 42 C 82 50, 88 70, 84 86 C 82 95, 60 97, 56 84 C 52 68, 54 50, 66 42 Z" ' + o + '/>',
          bladder: '<path d="M32 38 L24 12 M68 38 L76 12" ' + l + '/>' +
            '<path d="M28 44 C 28 26, 72 26, 72 44 C 80 62, 68 85, 50 85 C 32 85, 20 62, 28 44 Z" ' + o + '/>' +
            '<path d="M50 85 L50 95" ' + l + '/>',
          skin: '<rect x="10" y="24" width="80" height="16" rx="3" fill="#efe9dc" stroke="' + INK + '" stroke-width="3"/>' +
            '<rect x="10" y="40" width="80" height="42" rx="3" fill="#f9f6f0" stroke="' + INK + '" stroke-width="3"/>' +
            '<path d="M36 40 C 30 24, 70 24, 64 40 C 61 56, 39 56, 36 40 Z" fill="rgba(163,32,58,.16)" stroke="#a3203a" stroke-width="3.5"/>' +
            '<circle cx="45" cy="36" r="3" fill="#a3203a"/><circle cx="56" cy="42" r="3" fill="#a3203a"/>',
          kidney: '<path d="M66 10 C 84 10, 92 28, 92 48 C 92 72, 78 90, 58 90 C 42 90, 30 80, 30 66 C 30 58, 45 56, 45 50 C 45 44, 30 42, 30 34 C 30 18, 48 10, 66 10 Z" ' + o + '/>' +
            '<path d="M45 50 L14 56" ' + l + '/>',
        }[kind];
        return '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '">' + body + '</svg>';
      }
      function organ(parent, { kind, cx, cy, size }) {
        const d = document.createElement('div');
        d.className = 'org';
        d.style.cssText = 'left:' + (cx - size / 2) + 'px;top:' + (cy - size / 2) + 'px;width:' + size + 'px;height:' + size + 'px';
        d.innerHTML = organSvg(kind, size);
        parent.appendChild(d); return d;
      }

      // Kit.TRIALS order is melanoma, lung, bladder, kidney; the narration counts them lung,
      // bladder, melanoma, kidney, so the row is built in the narration's order.
      const T = Kit.TRIALS, byName = {};
      T.forEach((t) => { byName[t.organ] = t; });
      const COLS = [
        { kind: 'lung', t: byName['肺癌'], cue: 2 },
        { kind: 'bladder', t: byName['膀胱癌'], cue: 3 },
        { kind: 'skin', t: byName['黑色素瘤'], cue: 4 },
        { kind: 'kidney', t: byName['肾癌'], cue: 5 },
      ];

      const bigSkin = document.getElementById('next-bigskin');
      bigSkin.innerHTML = Kit.SKIN_SVG;
      bigSkin.querySelector('#lesion').id = 'next-lesion';

      // ---- page 1: the big row --------------------------------------------------------------
      const big = document.getElementById('next-big');
      const CX = [400, 800, 1200, 1600], SZ = 300;
      COLS.forEach((c, i) => {
        c.el = organ(big, { kind: c.kind, cx: CX[i], cy: 470, size: SZ });
        const nm = document.createElement('div');
        nm.className = 'label orgnm';
        nm.style.cssText = 'left:' + (CX[i] - 180) + 'px;top:646px;width:360px';
        nm.textContent = c.t.organ;
        big.appendChild(nm); c.nm = nm;
        const n = c.t.n, w = n * 26 + (n - 1) * 14;
        const dd = document.createElement('div');
        dd.className = 'dots';
        dd.style.cssText = 'left:' + (CX[i] - w / 2) + 'px;top:712px;width:' + w + 'px;height:26px';
        big.appendChild(dd);
        c.dots = Kit.dots(dd, { n, cols: n, size: 26, gap: 14, cls: 'sq imm' });
      });

      // ---- the footnote strip: the same four, small, out of the way --------------------------
      const strip = document.getElementById('next-strip');
      const SX = [1440, 1560, 1680, 1800];
      COLS.forEach((c, i) => {
        c.sel = organ(strip, { kind: c.kind, cx: SX[i], cy: 140, size: 80 });
        const n = c.t.n, w = n * 10 + (n - 1) * 5;
        const dd = document.createElement('div');
        dd.className = 'dots';
        dd.style.cssText = 'left:' + (SX[i] - w / 2) + 'px;top:188px;width:' + w + 'px;height:10px';
        strip.appendChild(dd);
        c.sdots = Kit.dots(dd, { n, cols: n, size: 10, gap: 5, cls: 'sq imm' });
      });

      // ---- the right column: three reasons, one of them live at a time ----------------------
      const list = document.getElementById('next-list');
      const ROWS = ['突变负荷高', '可手术切除', '已有免疫治疗'].map((t, i) => {
        const d = document.createElement('div');
        d.className = 'row';
        d.style.cssText = 'left:1320px;top:' + (340 + i * 120) + 'px';
        d.innerHTML = '<div class="rc">' + (i + 1) + '</div><div class="rt">' + t + '</div>';
        list.appendChild(d);
        return { el: d, rc: d.querySelector('.rc'), rt: d.querySelector('.rt') };
      });

      // ---- a stretch of genome: the bar, its base ticks, and its mutations -------------------
      function genomeBar(host, { x, y, w, h, n, seed, sparse, at }) {
        const bar = document.createElement('div');
        bar.className = 'gbar' + (sparse ? ' sp' : '');
        bar.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;transform-origin:left center';
        for (let bx = 26; bx < w - 18; bx += 30) {
          const b = document.createElement('div');
          b.className = 'gbase';
          b.style.cssText = 'left:' + bx + 'px;top:' + Math.round(h * 0.28) + 'px;height:' + Math.round(h * 0.44) + 'px';
          bar.appendChild(b);
        }
        host.appendChild(bar);
        const rng = Kit.rng(seed), muts = [], step = (w - 140) / (n > 1 ? n - 1 : 1);
        for (let i = 0; i < n; i++) {
          const mx = at ? at[i] : x + 70 + i * step + (rng() - 0.5) * step * 0.55;
          const d = document.createElement('div');
          d.className = 'mut';
          d.style.cssText = 'left:' + mx.toFixed(1) + 'px;top:' + (y + h / 2 - 9).toFixed(1) + 'px';
          host.appendChild(d); muts.push({ el: d, x: mx });
        }
        return { bar, muts };
      }

      // ① one long stretch, crowded with mutations, fingerprints growing out of it
      const r1 = document.getElementById('next-r1');
      const g1 = genomeBar(document.getElementById('next-bar1'), { x: 120, y: 580, w: 1080, h: 56, n: 26, seed: 7 });
      const stemBox = document.getElementById('next-stems'), pepBox = document.getElementById('next-peps1');
      const picks = [1, 4, 7, 10, 13, 16, 19, 23];
      const peps1 = [], stems = [];
      picks.forEach((i) => {
        const mx = g1.muts[i].x + 9;
        const st = document.createElement('div');
        st.className = 'stem';
        st.style.cssText = 'left:' + (mx - 1) + 'px;top:484px;height:96px';
        stemBox.appendChild(st); stems.push(st);
        peps1.push(Kit.pep(pepBox, { x: mx, y: 464, s: 1.15 }));
      });

      // ② the piece of tumour that goes to the sequencer
      const blk = document.getElementById('next-blk');
      [[44, 46, 86, 22], [68, 100, 128, 22], [40, 154, 70, 22], [140, 154, 84, 22]].forEach(([x, y, w, h]) => {
        const i2 = document.createElement('i');
        i2.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px';
        blk.appendChild(i2);
      });
      const arrow = Kit.lead(document.getElementById('next-arrow'), { x1: 596, y1: 560, x2: 744, y2: 560 });

      // the closing comparison: the same stretch twice, dense above, sparse below
      const g2 = genomeBar(document.getElementById('next-bar2'), { x: 120, y: 420, w: 1080, h: 56, n: 26, seed: 7 });
      const g3 = genomeBar(document.getElementById('next-bar3'), { x: 120, y: 620, w: 1080, h: 56, n: 2, sparse: true, at: [470, 880] });

      // ---- timeline ---------------------------------------------------------------------------
      const tl = gsap.timeline({ paused: true });
      const IN = { duration: 0.6, ease: 'expo.out' };
      const skin = COLS[2];

      // S.at(0) 同一套思路 — the melanoma we have been talking about, big, alone
      tl.fromTo('#next-bigskin', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: 'expo.out' }, S.at(0));
      tl.fromTo('#next-kick', { opacity: 0, x: -18 }, { opacity: 1, x: 0, ...IN }, S.at(0));
      tl.fromTo('#next-credit', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(0, 0.2));
      tl.fromTo('#next-credit2', { opacity: 0 }, { opacity: 0, duration: 0.1 }, S.at(0));

      // S.at(1) 九个试验 — it takes its slot in the row, and the count lands
      tl.fromTo('#next-bigskin', { opacity: 1 }, { opacity: 0, duration: 0.45, ease: 'power2.in' }, S.at(1));
      tl.fromTo(skin.el, { opacity: 0, y: 26 }, { opacity: 1, y: 0, ...IN }, S.at(1, 0.3));
      tl.fromTo('#next-nine', { opacity: 0, y: 22 }, { opacity: 1, y: 0, ...IN }, S.at(1, 0.2));
      tl.fromTo('#next-ninelb', { opacity: 0, x: -14 }, { opacity: 1, x: 0, ...IN }, S.at(1, 0.4));
      tl.fromTo(skin.nm, { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(1, 0.7));

      // S.at(2)–S.at(5) each organ lands on its own count
      COLS.forEach((c) => {
        if (c !== skin) {
          tl.fromTo(c.el, { opacity: 0, y: 26 }, { opacity: 1, y: 0, ...IN }, S.at(c.cue));
          tl.fromTo(c.nm, { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(c.cue, 0.25));
        }
        c.dots.forEach((d, j) => tl.fromTo(d, { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, S.at(c.cue, 0.3 + j * 0.09)));
      });
      tl.fromTo(skin.el, { scale: 1 }, { scale: 1.07, duration: 0.22, ease: 'power2.out' }, S.at(4));
      tl.fromTo(skin.el, { scale: 1.07 }, { scale: 1, duration: 0.45, ease: 'power2.inOut' }, S.at(4, 0.22));

      // S.at(6) 为什么先挑这些 — the row drops to a footnote and the plate for the answer is set
      tl.fromTo(big, { opacity: 1, y: 0 }, { opacity: 0, y: -26, duration: 0.45, ease: 'power2.in' }, S.at(6, 0.95));
      tl.fromTo('#next-nine', { opacity: 1 }, { opacity: 0, duration: 0.35 }, S.at(6, 0.95));
      tl.fromTo('#next-ninelb', { opacity: 1 }, { opacity: 0, duration: 0.35 }, S.at(6, 0.95));
      tl.fromTo(strip, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, S.at(6, 1.3));
      tl.fromTo('#next-striplb', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(6, 1.45));
      tl.fromTo('#next-schem', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(6, 1.45));
      tl.fromTo('#next-div', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.6, ease: 'expo.out' }, S.at(6, 1.4));
      ROWS.forEach((r, i) => tl.fromTo(r.el, { opacity: 0, x: 18 },
        { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, S.at(6, 1.5 + i * 0.1)));
      // the genome itself is on the plate before the mutations are named
      tl.fromTo(g1.bar, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.55, ease: 'expo.out' }, S.at(6, 1.5));

      // lighting the live reason, and putting the last one back in grey
      function light(i, on, off) {
        const r = ROWS[i];
        tl.fromTo(r.rt, { color: CTRL, fontWeight: 500 }, { color: INK, fontWeight: 700, duration: 0.4, ease: 'none' }, S.at(on));
        tl.fromTo(r.rc, { borderColor: LINE, color: CTRL, backgroundColor: 'rgba(255,255,255,1)' },
          { borderColor: IMM, color: IMM, backgroundColor: 'rgba(15,118,110,.12)', duration: 0.4, ease: 'none' }, S.at(on));
        tl.fromTo(r.rt, { color: INK, fontWeight: 700 }, { color: CTRL, fontWeight: 500, duration: 0.4, ease: 'none' }, S.at(off));
        tl.fromTo(r.rc, { borderColor: IMM, color: IMM, backgroundColor: 'rgba(15,118,110,.12)' },
          { borderColor: LINE, color: CTRL, backgroundColor: 'rgba(255,255,255,1)', duration: 0.4, ease: 'none' }, S.at(off));
      }
      light(0, 7, 9); light(1, 9, 11); light(2, 11, 13);

      // S.at(7) 它们突变多 — the stretch fills with crimson
      g1.muts.forEach((m, i) => tl.fromTo(m.el, { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, S.at(7, 0.12 + i * 0.016)));
      tl.fromTo('#next-mutlb', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(7, 0.2));
      tl.fromTo('#next-credit2', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(7, 0.2));

      // S.at(8) 指纹就多 — a fingerprint grows out of mutation after mutation
      stems.forEach((st, i) => tl.fromTo(st, { opacity: 0, scaleY: 0 },
        { opacity: 0.45, scaleY: 1, duration: 0.35, ease: 'power2.out' }, S.at(8, i * 0.06)));
      peps1.forEach((p, i) => tl.fromTo(p, { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out' }, S.at(8, 0.14 + i * 0.06)));

      // S.at(9)–S.at(10) 很多病人能手术切除，正好留得下组织
      tl.fromTo('#next-r1', { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.in' }, S.at(9));
      tl.fromTo('#next-blk', { opacity: 0, y: -22 }, { opacity: 1, y: 0, ...IN }, S.at(9, 0.35));
      tl.fromTo('#next-r2a', { opacity: 0 }, { opacity: 1, duration: 0.45 }, S.at(9, 0.7));
      tl.fromTo(arrow.line, { opacity: 0, scaleX: 0 }, { opacity: 0.8, scaleX: 1, duration: 0.4, ease: 'power2.out', transformOrigin: 'left center' }, S.at(10));
      tl.fromTo(arrow.anchor, { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, S.at(10, 0.3));
      tl.fromTo('#next-vial', { opacity: 0, y: 22 }, { opacity: 1, y: 0, ...IN }, S.at(9, 0.5));
      tl.fromTo('#next-vial .tis', { opacity: 0, y: -40 }, { opacity: 1, y: 0, ...IN }, S.at(10, 0.2));
      tl.fromTo('#next-r2b', { opacity: 0 }, { opacity: 1, duration: 0.45 }, S.at(10, 0.55));

      // S.at(11)–S.at(12) 本来就在用免疫治疗，疫苗加在现有方案上
      tl.fromTo('#next-r2', { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.in' }, S.at(11));
      tl.fromTo('#next-pd1', { opacity: 0, y: 22 }, { opacity: 1, y: 0, ...IN }, S.at(11, 0.35));
      tl.fromTo('#next-plus', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, S.at(12));
      tl.fromTo('#next-vax', { opacity: 0, x: 40 }, { opacity: 1, x: 0, ...IN }, S.at(12, 0.15));

      // S.at(13)–S.at(15) the same stretch, dense and sparse, side by side
      tl.fromTo('#next-r3', { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.in' }, S.at(13));
      tl.fromTo(g2.bar, { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(13, 0.35));
      g2.muts.forEach((m, i) => tl.fromTo(m.el, { opacity: 0 }, { opacity: 1, duration: 0.3 }, S.at(13, 0.4 + i * 0.012)));
      tl.fromTo('#next-cl1', { opacity: 0 }, { opacity: 1, duration: 0.45 }, S.at(13, 0.6));
      tl.fromTo(g3.bar, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: 'expo.out' }, S.at(13, 0.8));
      g3.muts.forEach((m, i) => tl.fromTo(m.el, { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, S.at(14, i * 0.16)));
