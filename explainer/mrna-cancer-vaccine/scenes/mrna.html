<template>
  <style>
    /* Scene 4 — one mRNA, thirty-four fingerprints. It opens on the picture scene 3 ended with

    #mrna-cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 0; }

  </style>

  <div id="mrna" class="world" data-composition-id="mrna" data-width="1920" data-height="1080">
    <div id="mrna-credit" class="credit" data-layout-ignore>最多 34 个新抗原：Merck/Moderna INTerpath backgrounder, 2026-08<br>用法：INTerpath-001（ESMO 2026 / NCT05933577）</div>

    <!-- the junction scene 3 left prised open -->
    <div id="mrna-pdl1"></div>
    <div id="mrna-ab">
      <svg viewBox="0 0 140 120" width="140" height="120" xmlns="http://www.w3.org/2000/svg">

          <path d="M 8 60 H 72"/><path d="M 72 60 L 130 18"/><path d="M 72 60 L 130 102"/>

    </div>

    <!-- the figure plate: the cell as a body, from S.at(4) on -->
    <canvas id="mrna-cv" width="1920" height="1080"></canvas>
    <div id="mrna-dna">
      <svg viewBox="0 0 170 86" width="220" height="106" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#16181d" stroke-width="5" stroke-linecap="round">
          <path class="mrna-helix" d="M 8 43 C 30 6, 56 6, 78 43 C 100 80, 126 80, 148 43" pathLength="1"/>
          <path class="mrna-helix" d="M 8 43 C 30 80, 56 80, 78 43 C 100 6, 126 6, 148 43" pathLength="1"/>
        </g>
        <g id="mrna-rungs" stroke="#16181d" stroke-width="3.5" stroke-linecap="round" opacity=".7">
          <line x1="31" y1="23" x2="31" y2="63"/><line x1="55" y1="23" x2="55" y2="63"/>
          <line x1="101" y1="23" x2="101" y2="63"/><line x1="125" y1="23" x2="125" y2="63"/>
        </g>
      </svg>
    </div>

    <div id="mrna-frame"></div>

  <script>
    (function () {
      const S = window.__storyshot;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const root = $('mrna');

      // ---- 1. the synthetic strand, and a point-on-the-curve helper -------------------------------
      // Kit.strand's wave is a chain of cubics whose visible swing is only ~0.385 * amp, so amp is
      // large here. The 34 stretches are placed by solving x(t) on the same cubics, which keeps them
      // evenly spread over the WHOLE strand (getPointAtLength is not needed and not even in length).
      const RX = 150, RY = 200, RW = 1620, RAMP = 240, RWAVES = 4;
      const rna = Kit.strand($('mrna-rna'), { x: 0, y: 270, w: RW, amp: RAMP, waves: RWAVES, ticks: 0 });
      rna.path.style.strokeDasharray = '1 1.2';          // a round cap dots a zero-length dash
      const RH = rna.h, SEG = RW / RWAVES;
      // where the curve is at a fraction of the strand's width, in frame px
      function onStrand(f) {
        const tx = Math.min(0.999999, Math.max(0, f)) * RW;
        const i = Math.min(RWAVES - 1, Math.floor(tx / SEG)), u = (tx - i * SEG) / SEG;
        let lo = 0, hi = 1, t = u;
        for (let k = 0; k < 24; k++) {                   // x(t) = 0.75t + 0.75t^2 - 0.5t^3, monotonic
          t = (lo + hi) / 2;
          (0.75 * t + 0.75 * t * t - 0.5 * t * t * t < u) ? (lo = t) : (hi = t);
        }
        const s = i % 2 ? 1 : -1;
        return { x: RX + tx, y: RY + RH / 2 + 3 * s * RAMP * t * (1 - t) * (1 - 2 * t) };
      }

      const segBox = $('mrna-seg'), N = Kit.DRUG.peptides, BD = 34;   // 34 stretches, 34 px each
      const segs = [];
      for (let i = 0; i < N; i++) {
        const p = onStrand((i + 0.5) / N);
        const d = document.createElement('div');
        d.className = 'dot tum sq';
        d.style.cssText = 'left:' + (p.x - RX - BD / 2) + 'px;top:' + (p.y - RY - BD / 2) +
          'px;width:' + BD + 'px;height:' + BD + 'px;border-radius:8px';
        segBox.appendChild(d); segs.push(d);
      }

      // ---- 2. the picture scene 3 ended on -------------------------------------------------------
      const tum = Kit.cell(root, { x: 520, y: 460, r: 470, cls: 'tum' });
      tum.id = 'mrna-tum';

      const tbox = $('mrna-tiles'), TX = 540, TY = 140;
      const LAND = [onStrand(0.36), onStrand(0.47), onStrand(0.58)];   // three points on the curve
      // [home x, home y, rotation on the membrane, lift dx, lift dy]
      const TILES = [[620, 222, -150, 15, -37], [724, 316, -104, 33, -23], [766, 452, -58, 40, -1]];
      const tiles = TILES.map(([x, y]) => Kit.pep(tbox, { x: x - TX, y: y - TY, s: 1.2 }));

      // ---- 3. the T cell group: it steps aside for the strand, and comes back to dock ------------
      const g = $('mrna-tgroup'), GX = 1090, GY = 290;
      const gx = (x) => x - GX, gy = (y) => y - GY;
      const imm = Kit.cell(g, { x: 260, y: 220, r: 400, cls: 'imm' });   // frame 1150..1550, 310..710
      imm.id = 'mrna-imm';
      const tcr = document.createElement('div');            // the V notch, pointing left
      tcr.className = 'tcr'; tcr.id = 'mrna-tcr';
      tcr.style.cssText = 'left:-23px;top:187px';           // same membrane spot as in scene 3
      imm.appendChild(tcr);

      // ---- 4. labels, each on a leader to the part it names --------------------------------------
      function lab(parent, { x, y, t, cls = '' }) {
        const d = document.createElement('div');
        d.className = 'label mrna-lab' + (cls ? ' ' + cls : '');
        d.style.cssText = 'left:' + x + 'px;top:' + y + 'px';
        d.innerHTML = t; parent.appendChild(d); return d;
      }
      function leader(parent, x1, y1, x2, y2) {
        const l = Kit.lead(parent, { x1, y1, x2, y2 });
        l.len = Math.hypot(x2 - x1, y2 - y1);   // the length to draw TO: reading it back off the
        gsap.set([l.line, l.anchor], { opacity: 0 });   // element's style is fragile once GSAP owns it
        return l;
      }
      const anchorRna = onStrand(0.70);
      const labPrint = lab(root, { x: 480, y: 230, t: '指纹（新抗原）' });
      const ldPrint = leader(root, 700, 252, LAND[0].x + 8, LAND[0].y - 48);
      const labRna = lab(root, { x: 1250, y: 230, t: 'mRNA' });
      const ldRna = leader(root, 1302, 276, anchorRna.x + 6, anchorRna.y - 30);
      const labMost = lab(root, { x: 120, y: 120, t: '最多', cls: 's' });
      const labSeg = lab(root, { x: 250, y: 206, t: '段新抗原' });
      const labFrom = lab(root, { x: 120, y: 276, t: '来自你自己的肿瘤', cls: 's' });
      const bead5 = onStrand(5.5 / N);
      const ld34 = leader(root, 368, 250, bead5.x, bead5.y);
      // from here on the labels sit ON the plate, each where the wide staging puts its subject.
      // Every leader is drawn while the camera is parked, so none of them is ever left pointing at
      // a place the camera has since moved away from.
      const labDose = lab(root, { x: 160, y: 162, cls: 's',
        t: '用法：' + Kit.DRUG.dose + ' 肌注，每 ' + Kit.DRUG.every + ' 周一次，最多 ' + Kit.DRUG.doses + ' 针' });
      const labCell = lab(root, { x: 160, y: 250, t: '肌肉细胞' });
      const ldCell = leader(root, 332, 268, 432, 322);
      const labLnp = lab(root, { x: 160, y: 640, t: '脂质颗粒' });
      const ldLnp = leader(root, 332, 658, 572, 652);
      const labMhc = lab(root, { x: 1190, y: 820, t: 'MHC' });
      const ldMhc = leader(root, 1256, 814, 1062, 712);
      const labDna = lab(root, { x: 160, y: 162, t: 'mRNA 不进入 DNA' });
      const ldDna = leader(root, 396, 180, 530, 456);
      const labT = lab(root, { x: 1300, y: 268, t: 'T 细胞' });
      const ldT = leader(root, 1367, 310, 1367, 344);

      /* ---- 5. the figure plate: the cell as a body ------------------------------------------------
         Everything in the plate is a pure function of one clock (frame3d below) and is drawn at the
         end of the tween that carries it, because frames are rendered by seeking: no 3D state may
         depend on which tween happened to run last. */
      const eng = Kit3.engine($('mrna-cv'), {
        bg: '#fbf9f4', ink: '#16181d', fov: 18, far: 240, creaseCut: 0.16, silhouetteCut: 0.008,
      });
      /* The film's own rule in three dimensions: --imm and --tum are a 3 px border over a 12% fill,
         never a slab. So the cell and the T cell — the two things that fill the frame — are washes,
         and full strength is kept for what is small: a fingerprint, the cradle holding it up. */
      const R3 = {
        cell:  ['#faf8f3', '#f2f0e9', '#dcd8cc'],   // the host: paper, with an ink membrane
        nuc:   ['#f0ece3', '#e5e1d5', '#cbc5b5'],
        rna:   ['#cf7d24', '#b45309', '#8a3f06'],
        lipid: ['#f7eadb', '#efe0ca', '#d9c4a5'],
        pep:   ['#b4293f', '#a3203a', '#7d172c'],   // small: full strength
        mhc:   ['#2a8d84', '#157e76', '#0a554f'],   // small: full strength
        tcell: ['#dcecea', '#cbe2de', '#a7c8c3'],   // large: --imm as a wash
      };
      const V3 = THREE.Vector3, M4 = new THREE.Matrix4(), QT = new THREE.Quaternion();
      const SC3 = new V3(1, 1, 1), TMP = new V3(), YAX = new V3(0, 1, 0);

      // the cell: an ellipsoid built at its final proportions, so the normals are the normals of the
      // shape that is actually drawn (scaling a mesh afterwards shears them and the tone drifts)
      const CA = 9.1, CB = 6.44, CC = 7.0;
      const cellGeo = new THREE.SphereGeometry(7, 72, 48);
      cellGeo.scale(CA / 7, CB / 7, CC / 7);
      cellGeo.computeVertexNormals();
      const cell = eng.solid(eng.scene, cellGeo, { ramp: R3.cell, tone: 'lit', opacity: 0.55 });
      const nucleus = eng.solid(eng.scene, new THREE.SphereGeometry(2.6, 44, 30), { ramp: R3.nuc, tone: 'lo' });
      nucleus.position.set(-3.6, 2.0, 1.6);

      // a point on that surface, and the direction the surface faces there
      function surf(x, y, z) {
        const l = Math.hypot(x, y, z); x /= l; y /= l; z /= l;
        return { p: new V3(CA * x, CB * y, CC * z), n: new V3(x / CA, y / CB, z / CC).normalize() };
      }

      // ---- the lipid particle, the same object the film shows being made two scenes later ----
      const lnpG = eng.part(eng.scene, { name: 'lnp' });
      const coilCurve = (() => {
        const r = Kit3.rng(29), pts = [];
        for (let i = 0; i < 24; i++) {
          const a = i * 1.37, b = i * 0.79, rr = 0.44 + r() * 0.52;
          pts.push(new V3(Math.cos(a) * rr, Math.sin(b) * rr * 0.95, Math.sin(a) * rr));
        }
        return new THREE.CatmullRomCurve3(pts, true);
      })();
      const coil = eng.solid(lnpG, new THREE.TubeGeometry(coilCurve, 300, 0.085, 8, true), { ramp: R3.rna, tone: 'hi' });
      const HEADS = 96, SHELL = 1.5;
      const heads = eng.instances(lnpG, new THREE.SphereGeometry(0.17, 12, 8), HEADS, { ramp: R3.lipid, tone: 'faint' });
      const hdir = [];
      for (let i = 0; i < HEADS; i++) {
        const y = 1 - 2 * (i + 0.5) / HEADS, rr = Math.sqrt(Math.max(0, 1 - y * y)), phi = i * 2.399963;
        hdir.push(new V3(Math.cos(phi) * rr, y, Math.sin(phi) * rr).multiplyScalar(SHELL));
      }
      for (let i = 0; i < HEADS; i++) heads.setMatrixAt(i, M4.compose(hdir[i], QT.identity(), SC3));
      heads.instanceMatrix.needsUpdate = true;
      heads.count = HEADS;
      const LNP_IN = new V3(-3.5, -2.2, 1.0), LNP_OUT = new V3(22, 7, 11);

      // what the strand comes apart into, once the cell has read it
      const BITN = 10, bitDir = [], br = Kit3.rng(77);
      const bits = eng.instances(eng.scene, new THREE.CapsuleGeometry(0.11, 0.5, 4, 10), BITN, { ramp: R3.rna, tone: 'mid' });
      for (let i = 0; i < BITN; i++) bitDir.push(new V3(br() - 0.5, br() - 0.5, br() - 0.5).normalize());

      /* ---- the fingerprints, standing on the surface where a T cell can read them ----
         Each one is a group pinned to a point of the membrane and turned to face out, so "rising to
         the surface" is one local number: the peptide climbs its own normal from deep inside. */
      const DIRS = [
        [-0.45, 0.80, 0.40], [0.05, 0.72, 0.69], [0.58, 0.46, 0.67], [-0.78, 0.10, 0.62],
        [0.02, -0.10, 1.00], [0.32, 0.08, 0.94], [0.80, 0.18, 0.57], [-0.62, -0.38, 0.69],
        [-0.10, -0.46, 0.88], [0.44, -0.42, 0.79], [0.86, -0.22, 0.46], [0.18, -0.70, 0.69],
      ];
      const DOCK = 6;                                   // the one the T cell reads
      // a stem and a dish: a cradle holding something up. A solid cone of signal colour reads as a
      // mushroom, and twelve of them read as decoration.
      const stemGeo = new THREE.CylinderGeometry(0.11, 0.15, 0.58, 16);
      stemGeo.translate(0, 0.29, 0);
      const dishGeo = new THREE.CylinderGeometry(0.40, 0.32, 0.09, 28);
      dishGeo.translate(0, 0.625, 0);
      const pepGeo = Kit3.slab(0.72, 0.22, 0.46, 0.09, 0.045);
      const sites = DIRS.map(([x, y, z], i) => {
        const { p, n } = surf(x, y, z);
        const g3 = eng.part(eng.scene, { at: [p.x, p.y, p.z], name: 'mhc' + i });
        g3.quaternion.setFromUnitVectors(YAX, n);
        const stem = eng.solid(g3, stemGeo, { ramp: R3.mhc, tone: 'mid' });
        const dish = eng.solid(g3, dishGeo, { ramp: R3.mhc, tone: 'hi' });
        const pep = eng.solid(g3, pepGeo, { ramp: R3.pep, tone: 'lit' });
        return { g: g3, plinth: [stem, dish], pep, n, p };
      });

      // ---- the T cell: it comes down its own normal onto that one site ----
      const tG = eng.part(eng.scene, { at: [sites[DOCK].p.x, sites[DOCK].p.y, sites[DOCK].p.z], name: 'tcell' });
      tG.quaternion.setFromUnitVectors(YAX, sites[DOCK].n);
      const tBody = eng.solid(tG, new THREE.SphereGeometry(2.4, 44, 30), { ramp: R3.tcell, tone: 'lit', opacity: 0.94 });
      const tcrGeo = new THREE.ConeGeometry(0.36, 0.86, 22);
      tcrGeo.rotateX(Math.PI);                          // apex down, towards the membrane
      const tcr3 = eng.solid(tG, tcrGeo, { ramp: R3.mhc, tone: 'lit' });

      // ---- 6. the timeline -----------------------------------------------------------------------
      const t0 = S.at(0), t1 = S.at(1), t2 = S.at(2), t3 = S.at(3), t4 = S.at(4);
      const t5 = S.at(5), t6 = S.at(6), t7 = S.at(7), t8 = S.at(8), t9 = S.at(9);
      const IN = 'expo.out';
      const show = (el, at, d = 0.5) => tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: d, ease: IN }, at);
      // Kit.lead's line carries an inline transform: rotate(), so it is drawn on by its width,
      // never by a GSAP scaleX (that would hand GSAP the whole transform and lose the angle).
      const draw = (l, at, d = 0.45) => {
        const w = l.len ?? (parseFloat(l.line.style.width) || 0);
        tl.fromTo(l.line, { opacity: 0, width: 0 }, { opacity: 0.8, width: w, duration: d, ease: IN }, at);
        tl.fromTo(l.anchor, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, at + d * 0.6);
      };
      const hide = (el, at, d = 0.4) => tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: d, ease: 'power2.in' }, at);
      const hideLead = (l, at, d = 0.4) => { hide(l.line, at, d); hide(l.anchor, at, d); };

      // S.at(0) "这支疫苗做的是另一件事：" — the brake story closes, the fingerprints lift off
      hide('#mrna-pdl1', t0, 0.5); hide('#mrna-ab', t0, 0.5); hide('#mrna-pd1', t0, 0.5);
      tiles.forEach((p, i) => {
        const [, , rot, dx, dy] = TILES[i];
        tl.fromTo(p, { rotation: rot, x: 0, y: 0 }, { rotation: 0, x: dx, y: dy, duration: 0.7, ease: IN }, t0 + 0.2 + i * 0.1);
      });

      // S.at(1) "把指纹直接交给免疫系统。" — they cross to the immune side and grow as they go
      tiles.forEach((p, i) => {
        const [hx, hy, , dx, dy] = TILES[i];
        tl.fromTo(p, { x: dx, y: dy }, { x: LAND[i].x - hx, y: LAND[i].y - hy, duration: 1.0, ease: IN }, t1 + i * 0.12);
        tl.fromTo(p, { scale: 1 }, { scale: 1.5, duration: 1.0, ease: IN }, t1 + i * 0.12);
      });
      tl.fromTo(tum, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.86, duration: 0.7, ease: 'power2.in' }, t1 + 0.5);
      show(labPrint, t1 + 1.1); draw(ldPrint, t1 + 1.15);

      // S.at(2) "它是一条人工合成的 mRNA，" — the T cell steps aside, the strand draws itself in
      tl.fromTo(g, { x: 50, y: -50 }, { x: 1000, y: -50, duration: 0.7, ease: 'power2.in' }, t2);
      tl.fromTo(rna.path, { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.95, ease: 'power2.out', autoRound: false }, t2 + 0.05);
      show(labRna, t2 + 0.7); draw(ldRna, t2 + 0.75);

      // S.at(3) "上面最多编码三十四段来自你自己肿瘤的新抗原。" — all 34, over the whole strand
      tiles.forEach((p, i) => tl.fromTo(p, { opacity: 1 }, { opacity: 0, duration: 0.3 }, t3 + 0.05 + i * 0.05));
      hide(labPrint, t3 + 0.05, 0.3); hideLead(ldPrint, t3 + 0.05, 0.3);
      tl.fromTo(segs, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN, stagger: 0.017 }, t3 + 0.1);
      show(labMost, t3 + 0.45, 0.45);
      tl.fromTo('#mrna-n34', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, t3 + 0.55);
      show(labSeg, t3 + 0.7, 0.45);
      draw(ld34, t3 + 0.65, 0.5);
      // lands on "来自你自己肿瘤", late in this long phrase, so the frame keeps moving
      show(labFrom, t3 + 2.35, 0.5);
      tl.fromTo('#mrna-credit', { opacity: 0 }, { opacity: 1, duration: 0.5 }, t3 + 0.5);

      // S.at(4) "打进肌肉以后，" — the flat half closes and the plate opens on the cell
      hide('#mrna-rna', t4, 0.55);
      tl.fromTo('#mrna-rna', { scale: 1, x: 0, y: 0 }, { scale: 0.14, x: 540, y: -240, duration: 0.6, ease: 'power2.in' }, t4);
      hide(labRna, t4, 0.35); hideLead(ldRna, t4, 0.35);
      [labMost, '#mrna-n34', labSeg, labFrom].forEach((e) => hide(e, t4, 0.35));
      hideLead(ld34, t4, 0.35);
      hide(g, t4, 0.3);                                   // the flat T cell from scene 3 does not come back
      show(labCell, t4 + 0.9); draw(ldCell, t4 + 0.95);
      show(labDose, t4 + 1.3, 0.55);

      // S.at(5) "你的细胞照着它把这些片段造出来，" — the particle is in, the fingerprints rise
      show(labLnp, t5 + 0.1); draw(ldLnp, t5 + 0.15);

      // S.at(6) "摆到表面给 T 细胞看。" — cradles come up all over the membrane, and a T cell arrives
      show(labMhc, t6 + 0.3); draw(ldMhc, t6 + 0.35);
      show(labT, t6 + 0.9); draw(ldT, t6 + 0.95);
      hide(labLnp, t6 + 1.95, 0.35); hideLead(ldLnp, t6 + 1.95, 0.35);
      [labCell, labDose, labT, labMhc].forEach((e) => hide(e, t6 + 1.95, 0.35));
      [ldCell, ldT, ldMhc].forEach((l) => hideLead(l, t6 + 1.95, 0.35));

      // S.at(7) "相当于一张通缉令。" — in on the one fit: a fingerprint held up, a receptor in it
      tl.fromTo('#mrna-frame', { opacity: 0, scaleX: 0.7 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: IN }, t7 + 0.6);
      tl.fromTo('#mrna-wanted', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: IN }, t7 + 0.8);

      // S.at(8) "mRNA 本身很快就降解了，" — back out, and the strand inside comes apart
      hide('#mrna-frame', t8 + 0.2, 0.35); hide('#mrna-wanted', t8 + 0.2, 0.35);

      // S.at(9) "不会进到你的 DNA 里。" — ink DNA in the nucleus, and no ochre anywhere near it
      tl.fromTo('#mrna-dna', { opacity: 0 }, { opacity: 1, duration: 0.3 }, t9 + 0.1);
      tl.fromTo('.mrna-helix', { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.85, ease: 'power1.inOut', autoRound: false }, t9 + 0.12);
      tl.fromTo('#mrna-rungs', { opacity: 0 }, { opacity: 0.7, duration: 0.4 }, t9 + 0.75);
      show(labDna, t9 + 0.5); draw(ldDna, t9 + 0.55);

      /* ---- the plate's own clock -------------------------------------------------------------- */
      const cl = (u) => (u < 0 ? 0 : u > 1 ? 1 : u);
      const seg3 = (t, a, b) => cl((t - a) / (b - a));
      const io3 = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
      const oo3 = (u) => 1 - (1 - u) * (1 - u);
      const mix3 = (a, b, u) => a + (b - a) * u;

      const DOCKP = sites[DOCK].p.clone().addScaledVector(sites[DOCK].n, 1.5);
      const CAM = [
        { t: t4,        tg: [0, 0, 0],                   az: -0.42, el: 0.180, dist: 78, sh: 4.6 },
        { t: t6 + 2.0,  tg: [0, 0, 0],                   az: -0.42, el: 0.180, dist: 78, sh: 4.6 },
        { t: t7 + 0.5,  tg: [DOCKP.x, DOCKP.y, DOCKP.z], az: -0.73, el: 0.245, dist: 38, sh: 0.0 },
        { t: t8 + 0.3,  tg: [DOCKP.x, DOCKP.y, DOCKP.z], az: -0.73, el: 0.245, dist: 38, sh: 0.0 },
        { t: t8 + 1.4,  tg: [0, 0, 0],                   az: -0.42, el: 0.180, dist: 78, sh: 4.6 },
      ];
      function camAt(t) {
        let i = 0;
        while (i < CAM.length - 2 && t >= CAM[i + 1].t) i++;
        const a = CAM[i], b = CAM[i + 1], u = io3(seg3(t, a.t, b.t));
        return { target: [mix3(a.tg[0], b.tg[0], u), mix3(a.tg[1], b.tg[1], u), mix3(a.tg[2], b.tg[2], u)],
          az: mix3(a.az, b.az, u), el: mix3(a.el, b.el, u), dist: mix3(a.dist, b.dist, u), shift: mix3(a.sh, b.sh, u) };
      }

      let lastBits = -1;
      function frame3d(t) {
        // the body, and the particle that gets in
        const open = seg3(t, t4 + 0.25, t4 + 1.05);
        eng.fade(cell, 0.55 * open);
        eng.fade(nucleus, oo3(seg3(t, t4 + 0.55, t4 + 1.25)));
        const travel = io3(seg3(t, t4 + 0.45, t4 + 1.65));
        lnpG.position.lerpVectors(LNP_OUT, LNP_IN, travel);
        const gone = seg3(t, t8 + 0.3, t8 + 1.1);
        eng.fade(coil, open * (1 - gone));
        eng.fade(heads, open * (1 - seg3(t, t8 + 0.6, t8 + 1.4)));

        // the fingerprints: up through the cell, then up onto a cradle on the outside
        for (let i = 0; i < sites.length; i++) {
          const st = sites[i], lag = i * 0.11;
          const rise = io3(seg3(t, t5 + 0.40 + lag, t5 + 1.50 + lag));
          const up = io3(seg3(t, t6 + 0.10 + lag * 0.6, t6 + 1.00 + lag * 0.6));
          const seat = io3(seg3(t, t6 + 0.25 + lag * 0.6, t6 + 1.15 + lag * 0.6));
          for (const m of st.plinth) { m.position.y = -1.1 + 1.1 * up; eng.fade(m, up > 0.015 ? 1 : 0); }
          st.pep.position.y = mix3(-6.5, 0.10, rise) + 0.57 * seat;
          eng.fade(st.pep, rise > 0.015 ? 1 : 0);
        }

        // the T cell comes down its own normal, hovers, and seats in the close-up
        const L = mix3(7.5, 2.2, io3(seg3(t, t6 + 0.5, t6 + 1.6))) - 1.26 * io3(seg3(t, t7 + 0.55, t7 + 1.15));
        tBody.position.y = L + 3.26;
        tcr3.position.y = L + 0.43;
        const tIn = seg3(t, t6 + 0.5, t6 + 0.9);
        eng.fade(tBody, 0.94 * tIn);
        eng.fade(tcr3, tIn);

        // and the strand it read comes apart
        const spread = oo3(seg3(t, t8 + 0.5, t8 + 2.4)), fade = 1 - seg3(t, t8 + 1.4, t8 + 2.6);
        bits.count = spread > 0 ? BITN : 0;
        if (spread !== lastBits) {
          for (let i = 0; i < BITN; i++) {
            QT.setFromUnitVectors(new V3(0, 1, 0), bitDir[i]);
            M4.compose(TMP.copy(bitDir[i]).multiplyScalar(0.6 + 4.2 * spread).add(LNP_IN), QT, SC3);
            bits.setMatrixAt(i, M4);
          }
          bits.instanceMatrix.needsUpdate = true;
          lastBits = spread;
        }
        eng.fade(bits, spread > 0.01 ? fade : 0);

        eng.look(camAt(t));
      }

      const P = { t: 0 };
      tl.fromTo(P, { t: 0 }, { t: S.duration, duration: S.duration, ease: 'none',
        onUpdate() { frame3d(P.t); eng.render(); } }, 0);
      frame3d(0);
      eng.render();

      window.__timelines['mrna'] = tl;
    })();
  </script>
</template>
