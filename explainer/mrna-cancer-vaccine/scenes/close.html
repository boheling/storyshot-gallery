<template>
  <style>
    /* scene-local only: everything else comes from scenes/kit/kit.css */
    /* 第 11 场是回顾：把讲过的东西再数一遍，数完就停。那不是结局。
       这一场才是结局 —— 说清楚这件事到底新在哪里、今天能说的只有哪一句，最后留下一张图：
       过去术后只能松开刹车，现在还可以递上一张通缉令。片子落在这个动作上，不是落在一张清单上。
       四段各装在一个铺满画面的容器里（#close-a…d），到点整段淡掉：段内各元素透明度不一样，
       一条一条淡会跳，淡容器不会。 */
    #close-strike1, #close-strike2 { position: absolute; height: 4px; border-radius: 2px;
                     background: var(--ctrl); transform-origin: 0% 50%; }
    #close-word    { position: absolute; font: 700 72px/1 var(--font); color: var(--ink); white-space: nowrap; }
    .vtag          { position: absolute; font: 500 22px/1 var(--mono); color: var(--ink-2); }
    #close-posname { position: absolute; font: 600 30px/1 var(--font); color: var(--rna); letter-spacing: .06em; }
    #close-brk     { position: absolute; border-radius: 10px; background: var(--ink); }
    .big2          { position: absolute; font: 700 68px/1 var(--font); color: var(--ink); white-space: nowrap; }
  </style>

  <div id="close" class="world" data-composition-id="close" data-width="1920" data-height="1080">
    <div id="close-kicker" class="kicker">最后</div>
    <div id="close-credit" class="credit" data-layout-ignore>INTerpath-001, ESMO 2026 LBA1<br>截至 2026-11，该疗法尚未在任何国家获批</div>

    <!-- 甲 (0)–(3)：新的不是 mRNA，也不是"个体化"这个词 -->
    <div id="close-a" style="position:absolute; inset:0;">
      <div id="close-at" class="label" style="left:300px; top:300px;">新的不是这两样</div>
      <div id="close-atr" class="rule" style="left:300px; top:356px; width:300px; height:3px;"></div>
      <div id="close-rnalab" class="label s" style="left:500px; top:706px;">mRNA</div>
      <div id="close-strike1" style="left:320px; top:560px; width:520px;"></div>
      <div id="close-word" style="left:1160px; top:506px;">“个体化”</div>
      <div id="close-strike2" style="left:1160px; top:560px; width:360px;"></div>
      </div>

    <!-- 乙 (4)–(12)：新的是，一支只给一个人用的药，赶得上那扇窗 -->
    <div id="close-b" style="position:absolute; inset:0;">
      <div id="close-bt" class="label" style="left:300px; top:276px;">新的是这件事做得出来</div>
      <div id="close-span" class="span" style="left:300px; top:512px; width:1320px; height:96px;"></div>
      <div id="close-spant" class="label" style="left:880px; top:462px;">13 周</div>
      <div id="close-ruler" class="ruler" style="left:300px; top:560px; width:1320px;"></div>
      <div id="close-l0" class="label s" style="left:300px; top:634px;">手术</div>
      <div id="close-l1" class="label s" style="left:1520px; top:634px;">第一针</div>
      <div id="close-dotlab" class="label" style="left:300px; top:740px;">打疫苗的 757 人，超过 99% 赶上了</div>
      <div id="close-dotschem" class="schem" style="left:300px; top:800px;" data-layout-ignore>示意：每 100 人</div>
      <div id="close-dots" class="dots" style="left:1000px; top:720px;"></div>
    </div>

    <!-- 丙 (13)–(16)：过去的药是为一种病做的，这一支是为一个人做的 -->
    <div id="close-c" style="position:absolute; inset:0;">
      <div id="close-c1t" class="label" style="left:300px; top:300px;">过去的抗癌药</div>
      <div id="close-c1s" class="big2" style="left:300px; top:368px;">为一种病做的</div>
      <div id="close-c2t" class="label hl r" style="left:1120px; top:300px;">这一支</div>
      <div id="close-c2s" class="big2 hl r" style="left:1120px; top:368px;">为一个人做的</div>
      <div id="close-vials" style="position:absolute; left:300px; top:560px; width:700px; height:300px;"></div>
      <div id="close-one" style="position:absolute; left:1120px; top:540px; width:420px; height:320px;"></div>
    </div>

    <!-- 丁 (17)–(24)：到今天为止，能说的只有一句 -->
    <div id="close-d" style="position:absolute; inset:0;">
      <div id="close-dt" class="label" style="left:300px; top:290px;">到今天为止，能说的只有这些</div>
      <div id="close-sheet" class="sheet" style="left:300px; top:370px; width:1320px; height:430px;"></div>
      <div id="close-fu" class="label s" style="left:424px; top:628px;">中位随访 24.6 个月　—　总生存期的曲线还没分开</div>
    </div>

    <!-- 戊 (25)–(28)：最后一拍 —— 过去只能松开刹车，现在还可以递上一张通缉令 -->
    <div id="close-e" style="position:absolute; inset:0;">
      <div id="close-et" class="label" style="left:300px; top:264px;">手术之后那段时间</div>
      <div id="close-past" class="label s" style="left:300px; top:360px;">过去</div>
      <div id="close-brk" style="left:424px; top:446px; width:264px; height:26px;"></div>
      <div id="close-brklab" class="label" style="left:300px; top:860px;">松开刹车</div>
      <div id="close-now" class="label s hl r" style="left:1120px; top:360px;">现在</div>
      <div id="close-pos" class="sheet rna" style="left:1120px; top:440px; width:520px; height:330px;"></div>
      <div id="close-posname" style="left:1160px; top:486px;">这个肿瘤的指纹</div>
      <div id="close-poslab" class="label hl r" style="left:1120px; top:860px;">还可以递上一张通缉令</div>
    </div>
  </div>

  <script>
    (function () {
      const S = window.__storyshot;
      const K = window.Kit;
      const A = (k, o) => S.at(k) + (o || 0);
      const ID = (s) => document.getElementById('close-' + s);

      /* ---- 甲：一条 mRNA，画出来再划掉 ---- */
      /* strand() 返回 { el, path, ticks, h }，不是元素本身；它自己写的 dasharray 是光秃秃的 '1'，
         圆线帽会在长度为 0 的时候画出一个点（svg_round_cap_hidden_dash），所以这里改成 '1 1.2'。 */
      const rnaS = K.strand(ID('a'), { x: 320, y: 450, w: 520, amp: 80, waves: 3, ticks: 0 });
      const rna = rnaS.el, rnaPath = rnaS.path;
      rna.id = 'close-rna';
      gsap.set(rnaPath, { strokeDasharray: '1 1.2' });

      /* ---- 乙：那扇窗上的五步，和一百个病人 ---- */
      const INNER = ['测序', '挑选', '合成', '放行', '运回'];
      const pins = INNER.map((t, i) => {
        const x = 300 + 1320 * (0.17 + i * 0.165);
        const p = document.createElement('div');
        p.className = 'pin'; p.id = 'close-pin' + i;
        p.style.cssText = `left:${x}px; top:544px; height:32px`;
        ID('b').appendChild(p);
        const lb = document.createElement('div');
        lb.className = 'label s'; lb.id = 'close-pl' + i;
        lb.style.cssText = `left:${x - 34}px; top:634px`;
        lb.textContent = t;
        ID('b').appendChild(lb);
        return [p, lb];
      });
      const people = K.dots(ID('dots'), { n: 100, cols: 20, size: 20, gap: 10 });

      /* ---- 丙：八支一模一样的药，和一支写了名字的 ---- */
      const vial = (parent, x, y, w, h) => {
        const v = document.createElement('div');
        v.className = 'vial';
        v.style.cssText = `left:${x}px; top:${y}px; width:${w}px; height:${h}px`;
        v.innerHTML = `<div class="cap"></div><div class="fill" style="height:${Math.round(h * 0.56)}px"></div>`;
        parent.appendChild(v);
        return v;
      };
      const many = Array.from({ length: 8 }, (_, i) => vial(ID('vials'), 20 + i * 84, 60, 58, 180));
      const one = vial(ID('one'), 40, 20, 118, 280);

      /* ---- 丁：三行，一行一句能说的话 ---- */
      const rows = [
        ['yes', '两年之内，复发的人更少'],
        ['off', '活得更久 —— 随访还不够长，看不出来'],
        ['no', '还没有在任何一个国家获批'],
      ].map(([k, t], i) => K.chk(ID('d'), { x: 360, y: 448 + i * 124, t, k }));
      rows.forEach((r, i) => { r.id = 'close-row' + i; });

      /* ---- 戊：T 细胞，和递过去的那张通缉令 ---- */
      const tcell = K.cell(ID('e'), { x: 556, y: 640, r: 264, cls: 'imm' });
      tcell.id = 'close-tcell';
      const peps = [-120, 0, 120].map((dx, i) => {
        const p = K.pep(ID('pos'), { x: 0, y: 0 });
        p.id = 'close-pep' + i;
        p.style.left = (1380 + dx - 37) + 'px';
        p.style.top = '600px';
        ID('e').appendChild(p);
        return p;
      });
      const HAND = { x1: 1108, y1: 632, x2: 706, y2: 638 };
      const hand = K.lead(ID('e'), HAND);
      hand.len = Math.hypot(HAND.x2 - HAND.x1, HAND.y2 - HAND.y1);
      hand.line.id = 'close-handl'; hand.anchor.id = 'close-handa';

      const INSIDE = (w) => [...ID(w).children];
      gsap.set([...INSIDE('a'), ...INSIDE('b'), ...INSIDE('c'), ...INSIDE('d'), ...INSIDE('e'), ID('credit')],
        { opacity: 0 });
      gsap.set([ID('strike1'), ID('strike2'), ID('atr'), ID('ruler'), ID('span')], { scaleX: 0, transformOrigin: '0% 50%' });
      gsap.set(hand.line, { width: 0 });

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(ID('kicker'), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, 0);

      /* ---------- 甲 (0)–(3) 新的不是 mRNA，也不是"个体化" ---------- */
      tl.fromTo(ID('at'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, A(0, 0.1));
      tl.fromTo(ID('atr'), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: 'power2.out', immediateRender: false }, A(1, 0.1));
      /* (2) 新的不是 mRNA */
      tl.fromTo(rna, { opacity: 0 }, { opacity: 1, duration: 0.3 }, A(2));
      tl.fromTo(rnaPath, { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 1.0, ease: 'power1.inOut', autoRound: false }, A(2, 0.1));
      tl.fromTo(ID('rnalab'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, A(2, 0.45));
      tl.fromTo(ID('strike1'), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: 'power2.inOut', immediateRender: false }, A(2, 1.0));
      tl.fromTo(rna, { opacity: 1 }, { opacity: 0.42, duration: 0.5, ease: 'power1.inOut' }, A(2, 1.2));
      /* (3) 也不是"个体化"这个词 */
      tl.fromTo(ID('word'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(3));
      tl.fromTo(ID('strike2'), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: 'power2.inOut', immediateRender: false }, A(3, 0.8));
      tl.fromTo(ID('word'), { opacity: 1 }, { opacity: 0.42, duration: 0.5, ease: 'power1.inOut' }, A(3, 1.0));

      /* ---------- 乙 (4)–(12) 新的是：一支药，在那扇窗里做出来 ---------- */
      tl.fromTo(ID('a'), { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power1.inOut' }, A(4));
      tl.fromTo(ID('bt'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, A(4, 0.7));
      /* (5)(6) 一支只给一个人用的药，能在手术之后的几周里 */
      tl.fromTo(ID('ruler'), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.8, ease: 'power2.out', immediateRender: false }, A(6));
      tl.fromTo([ID('l0'), ID('l1')], { opacity: 0 }, { opacity: 1, duration: 0.45, stagger: 0.2 }, A(6, 0.5));
      tl.fromTo(ID('span'), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.8, ease: 'power2.out', immediateRender: false }, A(6, 0.9));
      tl.fromTo(ID('spant'), { opacity: 0 }, { opacity: 1, duration: 0.45 }, A(6, 1.5));
      /* (7)(8)(9)(10) 设计、造、放行、运到 —— 四句话，五个点，最后一个跟着"运到" */
      [7, 8, 9, 10, 10].forEach((k, i) => {
        const off = i === 4 ? 0.7 : 0;
        tl.fromTo(pins[i][0], { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: 'expo.out' }, A(k, off));
        tl.fromTo(pins[i][1], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: 'expo.out' }, A(k, off + 0.1));
      });
      /* (11) 一千一百三十七个病人 (12) 超过 99% 都赶上了 */
      tl.fromTo(ID('dots'), { opacity: 0 }, { opacity: 1, duration: 0.3 }, A(11));
      tl.fromTo(people, { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.25, stagger: 0.006, ease: 'expo.out' }, A(11, 0.1));
      tl.fromTo(people.slice(0, 99), { backgroundColor: 'rgba(138,133,120,.14)', borderColor: '#8a8578' },
        { backgroundColor: '#0f766e', borderColor: '#0f766e', duration: 0.5, stagger: 0.03, ease: 'power1.inOut' }, A(12, 0.2));
      tl.fromTo(ID('dotlab'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(12, 1.6));
      tl.fromTo(ID('dotschem'), { opacity: 0 }, { opacity: 1, duration: 0.4 }, A(12, 3.2));

      /* ---------- 丙 (13)–(16) 为一种病做的，和为一个人做的 ---------- */
      tl.fromTo(ID('b'), { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power1.inOut' }, A(13));
      tl.fromTo(ID('c1t'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(13, 0.7));
      tl.fromTo(ID('vials'), { opacity: 0 }, { opacity: 1, duration: 0.3 }, A(13, 0.9));
      tl.fromTo(many, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.07, ease: 'expo.out' }, A(13, 1.0));
      tl.fromTo(ID('c1s'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, A(14));
      tl.fromTo(ID('c2t'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(15));
      tl.fromTo(ID('one'), { opacity: 0 }, { opacity: 1, duration: 0.3 }, A(15, 0.1));
      tl.fromTo(one, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(1.5)' }, A(15, 0.2));
      tl.fromTo(ID('c2s'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, A(16));

      /* ---------- 丁 (17)–(24) 能说的只有这些 ---------- */
      tl.fromTo(ID('c'), { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power1.inOut' }, A(17));
      tl.fromTo(ID('dt'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(17, 0.7));
      tl.fromTo(ID('sheet'), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, A(18));
      /* (19)(20) 两年之内，复发的人更少 */
      tl.fromTo(rows[0], { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.55, ease: 'expo.out' }, A(20));
      /* (21)(22)(23) 更久的事，要等 */
      tl.fromTo(rows[1], { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.55, ease: 'expo.out' }, A(22));
      /* (24) 还没有在任何一个国家获批 */
      tl.fromTo(ID('fu'), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, A(23, 0.2));
      tl.fromTo(rows[2], { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.55, ease: 'expo.out' }, A(24));
      tl.fromTo(ID('credit'), { opacity: 0 }, { opacity: 1, duration: 0.5 }, A(24, 0.5));

      /* ---------- 戊 (25)–(28) 最后一拍 ----------
         全片的两个图，最后并排放在一起：刹车，和通缉令。松开刹车是已经有的，通缉令是新的。
         最后一句话落下来的时候，那张通缉令正被递过去 —— 片子停在这个动作上，而不是停在
         一张写满了结论的表上。 */
      tl.fromTo(ID('d'), { opacity: 1 }, { opacity: 0, duration: 0.7, ease: 'power1.inOut' }, A(25));
      tl.fromTo(ID('et'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(25, 0.8));
      /* (26) 过去只能松开刹车 —— 刹车抬起来，T 细胞能动了 */
      tl.fromTo(ID('past'), { opacity: 0 }, { opacity: 1, duration: 0.4 }, A(26));
      tl.fromTo(tcell, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'expo.out' }, A(26, 0.1));
      tl.fromTo(ID('brk'), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, A(26, 0.5));
      tl.fromTo(ID('brk'), { y: 0, opacity: 1 }, { y: -70, opacity: 0.3, duration: 0.9, ease: 'power2.out' }, A(26, 1.1));
      tl.fromTo(ID('brklab'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(26, 1.3));
      /* (27) 现在， (28) 还可以递上一张通缉令 */
      tl.fromTo(ID('now'), { opacity: 0 }, { opacity: 1, duration: 0.4 }, A(27));
      tl.fromTo(ID('pos'), { opacity: 0, x: 170, y: 20 }, { opacity: 1, x: 0, y: 0, duration: 1.4, ease: 'power2.out' }, A(28, 0.1));
      tl.fromTo(ID('posname'), { opacity: 0, x: 170 }, { opacity: 1, x: 0, duration: 1.4, ease: 'power2.out' }, A(28, 0.1));
      peps.forEach((p, i) => {
        tl.fromTo(p, { opacity: 0, x: 170, scale: 0.7 }, { opacity: 1, x: 0, scale: 1, duration: 0.9, ease: 'back.out(1.4)' }, A(28, 0.45 + i * 0.22));
      });
      tl.fromTo(ID('poslab'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, A(28, 1.0));
      /* 递过去的那一下，一直走到最后一帧前：片子是落下去的，不是断掉的 */
      tl.fromTo(hand.line, { opacity: 1, width: 0 }, { opacity: 1, width: hand.len, duration: 2.6, ease: 'power1.inOut', immediateRender: false }, A(28, 1.4));
      tl.fromTo(hand.anchor, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2)' }, A(28, 3.8));

      window.__timelines['close'] = tl;
    })();
  </script>
</template>
