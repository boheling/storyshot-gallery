# Moderna/Merck 的 mRNA 个体化新抗原疗法（intismeran autogene，V940/mRNA-4157）：中文科普讲解。
# 每个屏幕上的数字都来自下面的来源，并在出现的那一场里以小字标注。
# Sources:
#  - Merck/Moderna, "Intismeran Autogene — INTerpath late-stage clinical development program"
#    backgrounder, Aug 2026: 最多 34 个新抗原；mRNA 瞬时、不整合进 DNA；九个 2/3 期试验的清单
#    （黑色素瘤 001/012、NSCLC 002/009/013/014、RCC 004、膀胱 005/011）。
#  - INTerpath-001, ESMO 2026 LBA1（2026-10-24, Georgina Long；数据截至 2026-06-30，中位随访 24.6 个月；
#    已被 NEJM 接受）: n=1,137，2:1 随机；intismeran 1 mg 肌注 q3w ×≤9 + 帕博利珠单抗 400 mg q6w ×≤9；
#    RFS 事件 136/757 (18.0%) vs 111/380 (29.2%)，HR 0.58 (95%CI 0.45–0.75), P<0.001；
#    24 个月 RFS 82.2% vs 70.0%；前 6 个月 HR 0.99 (0.66–1.49)，6 个月后 HR 0.42 (0.30–0.58)；
#    DMFS 24 个月 88.5% vs 80.2%，HR 0.62 (0.45–0.85), P=0.002；OS HR 0.77 (0.45–1.31), P=0.33（未成熟）；
#    全因 3–5 级 AE 23.6% vs 20.3%；发热 52.2% vs 8.2%；注射部位疼痛 51.0% vs 9.5%；
#    >99% 的 757 人成功完成个体化生产。
#  - ClinicalTrials.gov NCT05933577（INTerpath-001 入排）: 已完整切除的 IIB/IIC/III/IV 期皮肤黑色素瘤；
#    未接受过除手术外的系统治疗；末次手术到首剂不超过 13 周；排除眼部与黏膜黑色素瘤、无法切除的转移。
#  - Alexandrov et al. 2013 Nature 500:415（黑色素瘤与肺癌的体细胞突变负荷在常见肿瘤中最高）。
#  - 截至 2026-11-04，该疗法尚未在任何国家获批，仍为研究性药物。
name: mrna-cancer-vaccine
purpose: explainer
out: mrna-cancer-vaccine.mp4
lang: zh
ground: light
voice:
  provider: qwen
  voice: dylan
  pronounce:
    mRNA: m R N A
    PD-1: P D 一
    DNA: D N A
    T: T
subtitles: burn
music: { style: calm, bpm: 68 }
theme: { accent: "#0f766e", ink: "#16181d" }   # accent = 字幕里"正在念到"的那个词的颜色，也是片中免疫一侧的青色
scenes: { css: scenes/kit/kit.css, js: scenes/kit/kit.js }

steps:
  - scene: { file: scenes/hook.html, title: 切干净了，为什么还会回来, lead: 0.7 }
    say: 手术很顺利。肿瘤被完整切掉，切缘干净。但两年之后，一百个这样的病人里，大约有三十个复发了。注意，这是已经用上标准免疫治疗的那一组。问题不在刀口上。问题在手术看不见、也切不到的那些细胞。它们可能早就随着血液走了。

  - scene: { file: scenes/print.html, title: 癌细胞身上的指纹, lead: 0.6 }
    say: 癌细胞是从你自己的细胞变来的，所以免疫系统很难把它当外人。但它在变的过程中攒下了很多突变。有些突变会让它造出形状古怪的蛋白片段，正常细胞里根本没有。这些片段叫新抗原。它们就是这个肿瘤的指纹。而且每个病人的指纹都不一样。

  - scene: { file: scenes/brake.html, title: 松开刹车，还得给地址, lead: 0.6 }
    say: 现在的标准做法，是术后打 PD-1 抑制剂。癌细胞会按住 T 细胞的刹车，这个药把刹车松开。但松开刹车，不等于知道该追谁。有些病人的 T 细胞，从一开始就没认出那些指纹。刹车松了，车还停在原地。

  - scene: { file: scenes/mrna.html, title: 一条 mRNA，三十四段指纹, lead: 0.6 }
    say: 这支疫苗做的是另一件事：把指纹直接交给免疫系统。它是一条人工合成的 mRNA，上面最多编码三十四段来自你自己肿瘤的新抗原。打进肌肉以后，你的细胞照着它把这些片段造出来，摆到表面给 T 细胞看。相当于一张通缉令。mRNA 本身很快就降解了，不会进到你的 DNA 里。

  - scene: { file: scenes/flow.html, title: 从你的肿瘤到你的那一支, lead: 0.6 }
    say: 所以每个病人的药都不一样。手术切下来的肿瘤留一块，再抽一管血做对照。两边一起测序，挑出只有肿瘤才有的突变。再由算法排序，选出最可能被 T 细胞认出来的那些，最多三十四个。这一步决定了这个疗法只能一人一支。

  - scene: { file: scenes/make.html, title: 几周之内，赶一扇窗, lead: 0.6 }
    say: 选完才开始合成。这条 mRNA 从头造出来，包进脂质颗粒，灌装、放行，再运回病人所在的医院。整个过程要几周。而且它得赶一扇窗：试验规定，从手术到第一针，最多十三周。这件事比听起来难。三期试验里，超过百分之九十九的人都按时拿到了自己那一支。

  - scene: { file: scenes/trial.html, title: 三期试验怎么说, lead: 0.6 }
    say: 结果是今年十月底公布的。一千一百三十七个完整切除的病人，按二比一分成两组。一组打疫苗加 PD-1 抑制剂，一组只打 PD-1 抑制剂。两年之后，没有复发的比例是百分之八十二点二，对照组是百分之七十。复发或者死亡的风险，低了百分之四十二。

  - scene: { file: scenes/detail.html, title: 曲线的细节, lead: 0.6 }
    say: 但这条曲线值得看细节。头六个月，两组几乎重合。疫苗要先做出来，T 细胞也需要时间扩增。差距是从第六个月以后才拉开的，那之后风险低了百分之五十八。另外，总生存期现在还看不出差别，随访时间不够长。所以能说的是复发更少，还不能说活得更久。

  - scene: { file: scenes/who.html, title: 现在适合谁, lead: 0.6 }
    say: 那现在谁用得上？试验的门槛很具体。皮肤黑色素瘤，二 B 到四期，并且已经完整切除。之前没做过系统治疗。从手术到第一针不超过十三周。眼部和黏膜的黑色素瘤不算，没法切除的也不算。还有一个前提，得留下够做测序的肿瘤组织。最后要说清楚，这个药还没有获批。

  - scene: { file: scenes/next.html, title: 下一步是哪些癌, lead: 0.6 }
    say: 同一套思路正在别的癌种上试。现在有九个二期和三期试验：肺癌四个，膀胱癌两个，黑色素瘤两个，肾癌一个。为什么先挑这些？它们突变多，指纹就多。很多病人能手术切除，正好留得下组织。而且这些癌种本来就在用免疫治疗，疫苗是加在现有方案上。突变少的癌种，比如胰腺癌，这条路要难得多。

  - scene: { file: scenes/recap.html, title: 回顾, lead: 0.6, tail: 3.5 }
    say: 回顾一下。癌细胞的突变会留下指纹，也就是新抗原。mRNA 把指纹交给免疫系统，PD-1 抑制剂负责松开刹车。药是按人定制的，要测序、挑选、合成，几周才做得出来。目前的证据是，完整切除的黑色素瘤，两年内复发更少。更长的生存数据，还要等。
