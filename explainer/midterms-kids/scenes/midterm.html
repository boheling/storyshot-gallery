<template>
  <style>
    #midterm { position: absolute; inset: 0; overflow: hidden; }
    #midterm, #midterm * { box-sizing: border-box; }

    /* ---- the word itself: MIDTERM, which splits and then comes back together ---- */
    /* the row only centres the word in the frame; the word carries every move */
    #midterm-wordrow {
      position: absolute; left: 64px; top: 380px; width: 1792px; height: 168px;
      display: flex; justify-content: center; align-items: flex-start;
    }
    #midterm-word {
      display: flex; align-items: center;
      font: 800 168px/1 var(--font); letter-spacing: -.03em; color: var(--you);
      transform-origin: 50% 0;
    }
    /* a zero-width seam between MID and TERM: the two halves slide apart around it */
    #midterm-split { position: relative; flex: none; width: 0; height: 150px; }
    #midterm-splitbar {
      position: absolute; left: -6px; top: 0; width: 12px; height: 150px;
      border-radius: 6px; background: var(--you); opacity: 0;
    }

    /* ---- a President's four years ---- */
    #midterm-bar {
      position: absolute; left: 200px; top: 430px; width: 1040px; height: 66px;
      border-radius: 33px; background: rgba(243, 241, 234, .07);
      border: 5px solid rgba(154, 165, 189, .8); transform-origin: 0 50%;
    }
    #midterm-mid {
      position: absolute; left: 650px; top: 430px; width: 140px; height: 66px;
      border-radius: 26px; background: var(--you); opacity: 0;
    }
    #midterm-glow {
      position: absolute; left: 510px; top: 300px; width: 420px; height: 320px; opacity: 0;
      background: radial-gradient(closest-side, rgba(255, 201, 74, .42), rgba(255, 201, 74, 0) 100%);
    }
    .midterm-tick { position: absolute; top: 496px; width: 6px; height: 26px; border-radius: 3px; background: var(--chalk-2); opacity: 0; }
    .midterm-yr { position: absolute; top: 528px; width: 80px; text-align: center; opacity: 0; }
    #midterm-yr4 { position: absolute; left: 1228px; top: 528px; text-align: left; opacity: 0; }
    #midterm-presfig { position: absolute; left: 0; top: 0; width: 0; height: 0; }
    #midterm-pres { position: absolute; left: 90px; top: 150px; width: 220px; text-align: center; opacity: 0; }

    /* ---- what is elected at year 2 and at year 4 ---- */
    .midterm-ring { position: absolute; width: 140px; height: 140px; opacity: 0; }
    .midterm-key { position: absolute; left: 110px; font: 700 36px/1.28 var(--font); white-space: nowrap; opacity: 0; }

    /* ---- the pin that marks the middle ---- */
    #midterm-pin { position: absolute; left: 665px; top: 274px; width: 110px; height: 156px; opacity: 0; }

    /* ---- the small ballot sheet the next scene opens on ---- */
    #midterm-ballot { left: 1420px; top: 300px; width: 360px; height: 300px; opacity: 0; }
    #midterm-ballot .brow .tk { position: absolute; left: 4px; top: 4px; }
    #midterm-strike {
      position: absolute; left: 36px; top: 67px; width: 244px; height: 6px;
      border-radius: 3px; background: #8d93a4; transform-origin: 0 50%;
    }
  </style>

  <div id="midterm" class="world" data-composition-id="midterm" data-width="1920" data-height="1080">
    <div id="midterm-wordrow" data-layout-allow-overflow><div id="midterm-word" data-layout-allow-overflow><span
      id="midterm-w1">MID</span><i id="midterm-split"><b id="midterm-splitbar"></b></i><span
      id="midterm-w2">TERM</span></div></div>

    <div id="midterm-glow" data-layout-ignore></div>
    <div id="midterm-bar"></div>
    <div id="midterm-mid"></div>

    <div class="midterm-tick" style="left:457px"></div>
    <div class="midterm-tick" style="left:717px"></div>
    <div class="midterm-tick" style="left:977px"></div>
    <div class="midterm-tick" style="left:1237px"></div>
    <div class="midterm-yr label num" style="left:420px">1</div>
    <div class="midterm-yr label num" style="left:680px">2</div>
    <div class="midterm-yr label num" style="left:940px">3</div>
    <div id="midterm-yr4" class="label">4 years</div>

    <div id="midterm-presfig" data-layout-allow-overflow></div>
    <div id="midterm-pres" class="label">President</div>

    <div id="midterm-pin"></div>

    <div id="midterm-h2" class="midterm-ring" style="left:650px;top:600px"></div>
    <div id="midterm-h4" class="midterm-ring" style="left:1170px;top:600px"></div>
    <div id="midterm-s2" class="midterm-ring" style="left:650px;top:752px"></div>
    <div id="midterm-s4" class="midterm-ring" style="left:1170px;top:752px"></div>
    <div id="midterm-keyh" class="midterm-key" style="top:616px;color:var(--house)">the whole House<br>every 2 years</div>
    <div id="midterm-keys" class="midterm-key" style="top:768px;color:var(--senate)">about 1/3<br>of the Senate</div>

    <div id="midterm-ballot" class="ballot" data-layout-allow-overlap></div>

    <div id="midterm-credit" class="credit" data-layout-ignore>U.S. Constitution, Article I</div>
  </div>

  <script>
    (function () {
      const S = window.__storyshot;

      /* ---------- build ---------- */

      // the President: an office, not a person. A plain figure standing at year 0.
      Kit.person(document.getElementById('midterm-presfig'), { x: 200, y: 430, h: 210 });

      // one ring per election: the whole House (a full teal ring) and about a third of the
      // Senate (a third of a lavender ring). Same size, so "all of it" vs "part of it" reads.
      function ring(id, colour, part) {
        document.getElementById(id).innerHTML =
          '<svg viewBox="0 0 140 140" width="140" height="140" xmlns="http://www.w3.org/2000/svg">'
          + '<circle cx="70" cy="70" r="54" fill="none" stroke="#46506b" stroke-width="22"/>'
          + '<circle class="arc" cx="70" cy="70" r="54" fill="none" stroke="' + colour + '" stroke-width="22"'
          + ' stroke-linecap="round" pathLength="1" stroke-dasharray="' + part + ' 1" stroke-dashoffset="' + part + '"'
          + ' transform="rotate(-90 70 70)"/></svg>';
      }
      ring('midterm-h2', '#5ad1c4', 1);
      ring('midterm-h4', '#5ad1c4', 1);
      ring('midterm-s2', '#c2a6ff', 0.3333);
      ring('midterm-s4', '#c2a6ff', 0.3333);

      // the pin that lands on the middle of the term
      document.getElementById('midterm-pin').innerHTML =
        '<svg viewBox="0 0 110 156" width="110" height="156" xmlns="http://www.w3.org/2000/svg">'
        + '<path d="M 14 80 L 55 154 L 96 80 Z" fill="#ffc94a"/>'
        + '<circle cx="55" cy="55" r="50" fill="#ffc94a" stroke="#16203a" stroke-width="7"/>'
        + '<circle cx="55" cy="55" r="19" fill="#16203a"/></svg>';

      // the small ballot sheet: President struck through, House and Senate ticked.
      const sheet = document.getElementById('midterm-ballot');
      const TICK = '<svg class="tk" viewBox="0 0 28 28" width="28" height="28" xmlns="http://www.w3.org/2000/svg">'
        + '<path d="M 5 15 l 6 6 l 12 -15" fill="none" stroke="#2a3148" stroke-width="5" stroke-linecap="round"'
        + ' stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>';
      Kit.brow(sheet, { top: 52, text: 'President' });
      const rowH = Kit.brow(sheet, { top: 132, text: 'House' });
      const rowS = Kit.brow(sheet, { top: 212, text: 'Senate' });
      rowH.insertAdjacentHTML('beforeend', TICK);
      rowS.insertAdjacentHTML('beforeend', TICK);
      sheet.insertAdjacentHTML('beforeend', '<div id="midterm-strike"></div>');

      /* ---------- timeline ---------- */

      const tl = gsap.timeline({ paused: true });

      // (0) the word lands huge.
      tl.fromTo('#midterm-word', { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 1.3, duration: 0.7, ease: 'expo.out' }, S.at(0));

      // (1) and splits: MID | TERM.
      tl.fromTo('#midterm-w1', { x: 0 }, { x: -38, duration: 0.6, ease: 'expo.out' }, S.at(1) + 0.3);
      tl.fromTo('#midterm-w2', { x: 0 }, { x: 38, duration: 0.6, ease: 'expo.out' }, S.at(1) + 0.3);
      tl.fromTo('#midterm-splitbar', { opacity: 0, scaleY: 0 },
        { opacity: 0.9, scaleY: 1, duration: 0.6, ease: 'expo.out' }, S.at(1) + 0.3);

      // (2) it shrinks to the top; a President's four years appear under it.
      tl.fromTo('#midterm-wordrow', { y: 0 }, { y: -300, duration: 0.7, ease: 'expo.out' }, S.at(2));
      tl.fromTo('#midterm-word', { scale: 1.3 }, { scale: 0.56, duration: 0.7, ease: 'expo.out' }, S.at(2));
      tl.fromTo('#midterm-bar', { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.55, ease: 'expo.out' }, S.at(2) + 0.13);
      tl.fromTo('#midterm-presfig .person', { opacity: 0, y: 60 },
        { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, S.at(2) + 0.38);
      tl.fromTo('#midterm-pres', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, S.at(2) + 0.63);
      tl.fromTo('.midterm-tick', { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.3, stagger: 0.07 }, S.at(2) + 0.83);
      tl.fromTo('.midterm-yr, #midterm-yr4', { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.35, stagger: 0.07 }, S.at(2) + 0.98);

      // (3) the whole House is elected at year 2 and at year 4.
      tl.fromTo('#midterm-h2, #midterm-h4', { opacity: 0, y: -40 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out', stagger: 0.1 }, S.at(3) + 0.1);
      tl.fromTo('#midterm-h2 .arc, #midterm-h4 .arc', { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.5, ease: 'power2.inOut', autoRound: false, stagger: 0.1 }, S.at(3) + 0.3);
      tl.fromTo('#midterm-keyh', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.55, ease: 'expo.out' }, S.at(3) + 0.5);

      // (4) and about a third of the Senate, at the same two points.
      tl.fromTo('#midterm-s2, #midterm-s4', { opacity: 0, y: -40 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out', stagger: 0.1 }, S.at(4) + 0.1);
      tl.fromTo('#midterm-s2 .arc, #midterm-s4 .arc', { strokeDashoffset: 0.3333 },
        { strokeDashoffset: 0, duration: 0.5, ease: 'power2.inOut', autoRound: false, stagger: 0.1 }, S.at(4) + 0.3);
      tl.fromTo('#midterm-keys', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.55, ease: 'expo.out' }, S.at(4) + 0.5);

      // (5) a pin drops on the exact middle of the term, and that middle lights up.
      tl.fromTo('#midterm-pin', { opacity: 0, y: -320, scale: 0.7 },
        { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: 'expo.out' }, S.at(5) + 0.1);
      tl.fromTo('#midterm-mid', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(5) + 2.1);
      tl.fromTo('#midterm-glow', { opacity: 0 }, { opacity: 1, duration: 0.7 }, S.at(5) + 2.1);

      // (6-7) the word travels down onto the pin, and closes back up: MIDTERM.
      tl.fromTo('#midterm-wordrow', { y: -300 }, { y: -224, duration: 0.85, ease: 'expo.out' }, S.at(6) + 0.2);
      tl.fromTo('#midterm-word', { scale: 0.56, x: 0 },
        { scale: 0.64, x: -240, duration: 0.85, ease: 'expo.out' }, S.at(6) + 0.2);
      tl.fromTo('#midterm-w1', { x: -38 }, { x: 0, duration: 0.6, ease: 'expo.out' }, S.at(7));
      tl.fromTo('#midterm-w2', { x: 38 }, { x: 0, duration: 0.6, ease: 'expo.out' }, S.at(7));
      tl.fromTo('#midterm-splitbar', { opacity: 0.9 }, { opacity: 0, duration: 0.5, ease: 'expo.out' }, S.at(7));

      // (8) no President on the ballot that day.
      tl.fromTo('#midterm-ballot', { opacity: 0, x: 90, scale: 0.9 },
        { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: 'expo.out' }, S.at(8) - 0.35);
      tl.fromTo('#midterm-strike', { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power2.out' }, S.at(8) + 0.01);

      // (9) Congress is.
      tl.fromTo('#midterm-ballot .tk path', { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out', autoRound: false, stagger: 0.22 }, S.at(9));

      window.__timelines['midterm'] = tl;
    })();
  </script>
</template>
