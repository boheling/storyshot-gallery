<template>
  <style>
    /* scene 1 — "Who gets to decide?"  All tokens come from scenes/kit/kit.css */
    #hook-town, #hook-yard, #hook-kids, #hook-grown { position: absolute; inset: 0; }
    /* was a soft warm halo behind the school; a glow only reads as a stain on paper, so the same
       area is a flat warm panel with a crisp edge — the school's patch of sunlight */
    #hook-glow { position: absolute; left: 370px; top: 40px; width: 1180px; height: 800px;
      background: rgba(217,119,6,.09); border-radius: 72px; }
    #hook-arms, #hook-sight { position: absolute; left: 0; top: 0; }

    /* 78 px: label size, so the darkened amber rather than the outlined .hl treatment */
    #hook .qmark { position: absolute; font: 800 78px/1 var(--font); color: var(--you-ink); text-align: center; }

    #hook-field { position: absolute; left: 69px; top: 140px; width: 1782px; height: 752px; }
    #hook .fcard { position: absolute; width: 148px; height: 148px; border-radius: 22px;
      background: var(--ground-2); border: 4px solid var(--line);
      display: flex; align-items: center; justify-content: center; }
    #hook .fcard.mine { border-color: var(--you); box-shadow: 0 0 0 5px rgba(217,119,6,.22); }
    #hook .fcard svg { width: 96px; height: 96px; }

    #hook .qrow { position: absolute; left: 46px; font: 700 36px/1 var(--font); color: var(--chalk); white-space: nowrap; }
    #hook .qrow.last { color: var(--chalk-2); }

    /* a folded slip going into the ballot box's slot */
    #hook-slip { position: absolute; left: 145px; top: -54px; width: 170px; height: 172px; overflow: hidden; }
    /* a white sheet on warm paper: the edge is an inset ring so the lines inside do not shift */
    #hook-slip .paper { position: absolute; left: 17px; top: 12px; width: 136px; height: 160px;
      border-radius: 10px; background: var(--ground-2);
      box-shadow: inset 0 0 0 3px var(--line), 0 6px 14px rgba(26,35,56,.14); }
    #hook-slip .paper i { position: absolute; left: 20px; height: 9px; border-radius: 5px; background: var(--chalk-2); }
  </style>

  <div id="hook" class="world" data-composition-id="hook" data-width="1920" data-height="1080">

    <!-- ========== your school, and the people who decide about it ========== -->
    <div id="hook-town" data-layout-allow-overlap>

      <div id="hook-yard">
        <div id="hook-glow" data-layout-ignore></div>

        <svg id="hook-school" width="900" height="521" viewBox="0 0 760 440" fill="none"
             style="position:absolute;left:510px;top:170px">
          <!-- belfry: an open bell tower on the roof -->
          <path d="M314 28 L380 2 L446 28 Z" fill="#1a2338"/>
          <rect x="330" y="28" width="11" height="32" fill="#1a2338"/>
          <rect x="419" y="28" width="11" height="32" fill="#1a2338"/>
          <path d="M363 54 C363 28 397 28 397 54 Z" fill="#d97706"/>
          <circle cx="380" cy="58" r="6" fill="#d97706"/>
          <rect x="310" y="56" width="140" height="13" rx="6" fill="#1a2338"/>
          <!-- a plain pennant on a pole -->
          <path d="M150 62 V 12" stroke="#1a2338" stroke-width="7" stroke-linecap="round"/>
          <path d="M153 16 L210 30 L153 44 Z" fill="#d97706"/>
          <!-- roof -->
          <path d="M14 152 L128 62 L632 62 L746 152 Z" fill="#ffffff" stroke="#1a2338" stroke-width="7" stroke-linejoin="round"/>
          <!-- a long, low building -->
          <rect x="40" y="152" width="680" height="268" rx="22" fill="#ffffff" stroke="#1a2338" stroke-width="7"/>
          <!-- a classroom window for every room -->
          <rect x="72" y="196" width="76" height="94" rx="10" fill="#f6f1e6" stroke="#1a2338" stroke-width="6"/>
          <path d="M110 196 v94 M72 243 h76" stroke="#1a2338" stroke-width="4" opacity=".45"/>
          <rect x="158" y="196" width="76" height="94" rx="10" fill="#f6f1e6" stroke="#1a2338" stroke-width="6"/>
          <path d="M196 196 v94 M158 243 h76" stroke="#1a2338" stroke-width="4" opacity=".45"/>
          <rect x="244" y="196" width="76" height="94" rx="10" fill="#f6f1e6" stroke="#1a2338" stroke-width="6"/>
          <path d="M282 196 v94 M244 243 h76" stroke="#1a2338" stroke-width="4" opacity=".45"/>
          <rect x="440" y="196" width="76" height="94" rx="10" fill="#f6f1e6" stroke="#1a2338" stroke-width="6"/>
          <path d="M478 196 v94 M440 243 h76" stroke="#1a2338" stroke-width="4" opacity=".45"/>
          <rect x="526" y="196" width="76" height="94" rx="10" fill="#f6f1e6" stroke="#1a2338" stroke-width="6"/>
          <path d="M564 196 v94 M526 243 h76" stroke="#1a2338" stroke-width="4" opacity=".45"/>
          <rect x="612" y="196" width="76" height="94" rx="10" fill="#f6f1e6" stroke="#1a2338" stroke-width="6"/>
          <path d="M650 196 v94 M612 243 h76" stroke="#1a2338" stroke-width="4" opacity=".45"/>
          <!-- the front entrance: a pediment over double doors -->
          <path d="M318 196 L380 158 L442 196 Z" fill="#ffffff" stroke="#1a2338" stroke-width="6" stroke-linejoin="round"/>
          <rect x="332" y="200" width="96" height="220" rx="14" fill="#f6f1e6" stroke="#1a2338" stroke-width="7"/>
          <path d="M380 206 v212" stroke="#1a2338" stroke-width="5" opacity=".4"/>
          <circle cx="368" cy="312" r="7" fill="#d97706"/>
          <circle cx="392" cy="312" r="7" fill="#d97706"/>
          <rect x="290" y="410" width="180" height="22" rx="10" fill="#5d6578"/>
          <rect x="0" y="424" width="760" height="12" rx="6" fill="#1a2338" opacity=".5"/>
        </svg>

        <div id="hook-kids"></div>
      </div>

      <!-- the grown-up who decides, standing behind the two cards -->
      <div id="hook-grown">
        <svg id="hook-arms" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" data-layout-ignore>
          <path d="M1375 668 L1288 464" stroke="#5d6578" stroke-width="28" stroke-linecap="round"/>
          <path d="M1545 668 L1632 464" stroke="#5d6578" stroke-width="28" stroke-linecap="round"/>
          <circle cx="1286" cy="458" r="26" fill="#5d6578"/>
          <circle cx="1634" cy="458" r="26" fill="#5d6578"/>
        </svg>
      </div>

      <!-- the two things somebody already decided for you -->
      <div id="hook-clock" class="card" style="left:1120px;top:300px;width:320px;height:280px">
        <svg width="150" height="150" viewBox="0 0 100 100" fill="none" style="position:absolute;left:85px;top:26px">
          <circle cx="50" cy="50" r="42" fill="#f6f1e6" stroke="#1a2338" stroke-width="7"/>
          <path d="M50 50 L33 33" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
          <path d="M50 50 L50 82" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="5" fill="#b45309"/>
        </svg>
        <div class="label" style="left:0;top:198px;width:320px;text-align:center">Recess 10:30</div>
      </div>

      <div id="hook-lunch" class="card" style="left:1480px;top:300px;width:320px;height:280px">
        <svg width="240" height="172" viewBox="0 0 140 100" fill="none" style="position:absolute;left:40px;top:14px">
          <rect x="4" y="22" width="132" height="64" rx="14" fill="#f6f1e6" stroke="#1a2338" stroke-width="6"/>
          <circle cx="40" cy="54" r="23" stroke="#5d6578" stroke-width="5"/>
          <path d="M26 63 L40 38 L54 63 Z" fill="#5d6578"/>
          <path d="M78 78 V46 L88 33 L98 46 V78 Z" fill="#5d6578"/>
          <circle cx="118" cy="58" r="14" fill="#d97706"/>
          <path d="M118 44 v-8" stroke="#1a2338" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div class="label" style="left:0;top:198px;width:320px;text-align:center">Lunch</div>
      </div>

      <div id="hook-q1" class="qmark" style="left:1130px;top:206px;width:300px">?</div>
      <div id="hook-q2" class="qmark" style="left:1490px;top:206px;width:300px">?</div>

      <!-- the yellow kid looks up at something out of reach -->
      <svg id="hook-sight" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" data-layout-ignore>
        <path d="M588 716 L1092 360" stroke="#b45309" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="6 20" opacity=".8"/>
        <circle cx="1092" cy="360" r="9" fill="#b45309" opacity=".8"/>
      </svg>
    </div>

    <!-- ========== one school is one of thousands of places ========== -->
    <div id="hook-field" data-layout-allow-overlap data-layout-allow-overflow></div>

    <!-- ========== too many questions to vote on every one ========== -->
    <div id="hook-list" class="card" style="left:580px;top:160px;width:760px;height:620px" data-layout-allow-overlap>
      <div class="qrow" style="top:52px">When is recess?</div>
      <div class="qrow" style="top:142px">What is for lunch?</div>
      <div class="qrow" style="top:232px">A new road here?</div>
      <div class="qrow" style="top:322px">Who mows the park?</div>
      <div class="qrow" style="top:412px">A bigger hospital?</div>
      <div class="qrow last" style="top:502px">… and millions more</div>
      <svg id="hook-ex" width="620" height="620" viewBox="0 0 100 100" fill="none"
           style="position:absolute;left:70px;top:0px" data-layout-ignore>
        <path d="M19 19 L81 81 M81 19 L19 81" stroke="#5d6578" stroke-width="11" stroke-linecap="round" opacity=".45"/>
      </svg>
    </div>

    <!-- ========== people pick people to decide ========== -->
    <div id="hook-crowd" data-layout-allow-overlap
         style="position:absolute;left:100px;top:420px;width:1720px;height:460px"></div>

    <!-- ========== the seam: the ballot box, centred ========== -->
    <div id="hook-boxwrap" style="position:absolute;left:730px;top:250px;width:460px;height:460px">
      <div id="hook-slip" data-layout-ignore>
        <div class="paper">
          <i style="top:34px;width:96px"></i><i style="top:62px;width:70px"></i><i style="top:90px;width:86px"></i>
        </div>
      </div>
    </div>
    <div id="hook-election" class="big hl" style="left:660px;top:742px;width:600px;text-align:center">Election</div>
  </div>

  <script>
    (function () {
      const S = window.__storyshot;
      const R = document.getElementById('hook');
      const q = s => R.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      /* ---------- kids in front of the school; the middle one is YOU ---------- */
      const kidsEl = q('#hook-kids');
      const kids = [600, 780, 960, 1140, 1320].map((x, i) =>
        Kit.person(kidsEl, { x, y: 866, h: 155, cls: i === 2 ? 'on' : '' }));
      const you = kids[2];
      const others = [kids[0], kids[1], kids[3], kids[4]];

      /* ---------- the grown-up who decides (behind the cards) ---------- */
      const grown = Kit.person(q('#hook-grown'), { x: 1460, y: 870, h: 380 });

      /* ---------- a field of places: schools, roads, parks, hospitals ---------- */
      const IC = {
        school: '<path d="M50 20 V4"/><path d="M50 5 h15 l-5 5 l5 5 h-15"/><path d="M8 48 L50 20 L92 48"/>'
              + '<rect x="20" y="48" width="60" height="36" rx="5"/><rect x="43" y="64" width="14" height="20" rx="3"/>',
        road:   '<path d="M20 88 L40 18 L60 18 L80 88"/><path d="M50 28 v10 M50 50 v10 M50 72 v10"/>',
        park:   '<path d="M50 12 L70 42 H30 Z"/><path d="M50 32 L76 68 H24 Z"/><path d="M50 68 v16"/><path d="M16 86 h68"/>',
        hosp:   '<rect x="22" y="24" width="56" height="60" rx="8"/><path d="M50 38 v32 M34 54 h32" stroke-width="9"/>'
      };
      const glyph = k => '<svg viewBox="0 0 100 100" fill="none" stroke="#5d6578" stroke-width="6"'
        + ' stroke-linecap="round" stroke-linejoin="round">' + IC[k] + '</svg>';
      const keys = ['school', 'road', 'park', 'hosp'];
      const FIELD = q('#hook-field');
      const rnd = Kit.rng(7);
      let mine = null;
      const rest = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 9; c++) {
        const isMine = (r === 1 && c === 4);
        const d = document.createElement('div');
        d.className = 'fcard' + (isMine ? ' mine' : '');
        d.style.left = (25 + c * 198) + 'px';
        d.style.top = (20 + r * 188) + 'px';
        d.innerHTML = glyph(isMine ? 'school' : keys[Math.floor(rnd() * 4)]);
        FIELD.appendChild(d);
        if (isMine) mine = d; else rest.push({ d, k: Math.hypot(c - 4, (r - 1) * 1.6) });
      }
      rest.sort((a, b) => a.k - b.k);               // spreads outwards from your own school
      const fcards = rest.map(o => o.d);

      /* ---------- the crowd, and the handful it picks ---------- */
      const crowd = Kit.people(q('#hook-crowd'), { n: 72, cols: 18, w: 1720, h: 460, size: 100, seed: 5 });
      const risers = [1, 4, 7, 10, 13, 16].map(i => crowd[i]);
      const riserInk = [];
      risers.forEach(p => { riserInk.push(p.querySelector('.hd'), p.querySelector('.bd')); });

      /* ---------- the ballot box (the seam into scene 2) ---------- */
      const bw = q('#hook-boxwrap');
      bw.insertAdjacentHTML('beforeend', Kit.BOX_SVG);   // the box draws over the slip's lower end
      const boxSvg = bw.querySelector('svg');
      boxSvg.setAttribute('width', 460);
      boxSvg.setAttribute('height', 460);
      boxSvg.style.position = 'absolute';
      boxSvg.style.left = '0'; boxSvg.style.top = '0';

      /* ===================== the timeline ===================== */

      // (0) "Think about your school." — the school is already there; it lifts and warms up.
      tl.fromTo('#hook-glow', { opacity: 0 }, { opacity: 1, duration: .8 }, S.at(0));
      tl.fromTo('#hook-school', { y: 14 }, { y: 0, duration: .7, ease: 'expo.out' }, S.at(0));
      tl.fromTo(you, { scale: 1 }, { scale: 1.1, duration: .32, yoyo: true, repeat: 1, transformOrigin: '50% 100%' }, S.at(0) + .15);

      // (1) "Who decided when recess is?" — the clock card arrives with a "?"
      tl.fromTo('#hook-yard', { x: 0 }, { x: -400, duration: .8, ease: 'power2.inOut' }, S.at(1));
      tl.fromTo('#hook-clock', { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: .7, ease: 'expo.out' }, S.at(1) + .15);
      tl.fromTo('#hook-q1', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'back.out(2)', transformOrigin: '50% 100%' }, S.at(1) + .45);

      // (2) "Who decided what is for lunch?" — the lunch tray joins it
      tl.fromTo('#hook-lunch', { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: .7, ease: 'expo.out' }, S.at(2));
      tl.fromTo('#hook-q2', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'back.out(2)', transformOrigin: '50% 100%' }, S.at(2) + .3);

      // (3) "Not you," — the rest of the school dims; the two cards lift out of reach
      tl.fromTo([...others, '#hook-school', '#hook-glow'], { opacity: 1 }, { opacity: .3, duration: .5 }, S.at(3));
      tl.fromTo(['#hook-clock', '#hook-lunch', '#hook-q1', '#hook-q2'], { y: 0 }, { y: -130, duration: .6, ease: 'expo.out' }, S.at(3));

      // (4) "probably." — the yellow kid looks up at them
      tl.fromTo(you, { rotate: 0 }, { rotate: -9, duration: .45, ease: 'expo.out', transformOrigin: '50% 100%' }, S.at(4));
      tl.fromTo('#hook-sight', { opacity: 0 }, { opacity: 1, duration: .45 }, S.at(4));

      // (5) "Somebody decided for you." — a bigger grown-up, a hand on each card
      tl.fromTo(grown, { y: 170, opacity: 0 }, { y: 0, opacity: 1, duration: .7, ease: 'expo.out' }, S.at(5));
      tl.fromTo('#hook-arms', { opacity: 0 }, { opacity: 1, duration: .45 }, S.at(5) + .25);

      // (6) "A whole country works the same way," — your school becomes one of thousands
      tl.fromTo('#hook-town', { scale: 1, y: 0 }, { scale: .14, y: -78, duration: 1, ease: 'power2.inOut', transformOrigin: '50% 46.3%' }, S.at(6));
      tl.fromTo('#hook-town', { opacity: 1 }, { opacity: 0, duration: .45 }, S.at(6) + .55);
      tl.fromTo(mine, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: 'expo.out' }, S.at(6) + .6);
      tl.fromTo(fcards, { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: .5, ease: 'expo.out', stagger: .022 }, S.at(6) + .75);

      // (7) "only much bigger." — the field keeps growing past the edges
      tl.fromTo('#hook-field', { scale: 1 }, { scale: 1.75, duration: 1.6, ease: 'power1.inOut', transformOrigin: '50% 50%' }, S.at(7));

      // (8) "Nobody votes on every single question." — the questions, and one big grey no
      tl.fromTo('#hook-field', { opacity: 1 }, { opacity: .13, duration: .5 }, S.at(8));
      tl.fromTo('#hook-list', { scale: .8, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'expo.out', transformOrigin: '50% 50%' }, S.at(8));
      tl.fromTo('#hook-ex', { scale: 1.9, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, ease: 'power3.in', transformOrigin: '50% 50%' }, S.at(8) + .45);

      // (9) "Instead," — a crowd of people
      tl.fromTo('#hook-list', { scale: 1 }, { scale: .86, duration: .4, ease: 'power2.in', transformOrigin: '50% 50%' }, S.at(9));
      tl.fromTo('#hook-list', { opacity: 1 }, { opacity: 0, duration: .4 }, S.at(9));
      tl.fromTo('#hook-field', { opacity: .13 }, { opacity: 0, duration: .4 }, S.at(9));
      tl.fromTo(crowd, { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: .45, ease: 'expo.out', stagger: { each: .004, from: 'center' } }, S.at(9) + .08);

      // (10) "people pick other people to decide for them." — a handful rise, and turn yellow
      tl.fromTo(risers, { y: 0 }, { y: -86, duration: .6, ease: 'expo.out', stagger: .06 }, S.at(10) + .1);
      tl.fromTo(riserInk, { backgroundColor: '#5d6578' }, { backgroundColor: '#d97706', duration: .45, stagger: .03 }, S.at(10) + .15);

      // (11) "Picking those deciders is what an election is for." — the ballot box, centred
      tl.fromTo('#hook-crowd', { opacity: 1 }, { opacity: 0, duration: .5 }, S.at(11));
      tl.fromTo('#hook-boxwrap', { scale: .5, opacity: 0, y: -50 },
        { scale: 1, opacity: 1, y: 0, duration: .75, ease: 'expo.out', transformOrigin: '50% 50%' }, S.at(11) + .2);
      tl.fromTo('#hook-slip .paper', { y: -190, rotate: -5 },
        { y: 0, rotate: -5, duration: .65, ease: 'expo.out' }, S.at(11) + .35);
      tl.fromTo('#hook-election', { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: .55, ease: 'expo.out' }, S.at(11) + .85);

      window.__timelines['hook'] = tl;
    })();
  </script>
</template>
