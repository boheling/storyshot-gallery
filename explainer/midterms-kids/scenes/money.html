<template>
  <style>

    /* the ballot scene 5 ends on: same sheet, same place, handed over to the law on (2) */

      border-radius: 50%; background: var(--you); }
    #money-crowd { position: absolute; left: 240px; top: 640px; width: 1500px; height: 190px; }

    #money-jar { left: 680px; top: 40px; width: 560px; height: 430px; }
    #money-funnel { position: absolute; left: 830px; top: 464px; }
    #money .post { position: absolute; top: 556px; width: 16px; height: 84px;
      border-radius: 8px; background: var(--chalk-2); }
    #money-post-l { left: 846px; }
    #money-post-r { left: 1062px; }
    #money .leaf { position: absolute; top: 572px; width: 100px; height: 50px; border-radius: 10px;
      background: var(--off); border: 5px solid var(--chalk-2); }
    #money-gate-l { left: 862px; }
    #money-gate-r { left: 962px; }
    #money-scroll { position: absolute; left: 500px; top: 390px; }
    #money-rulelab { left: 500px; top: 334px; }
    #money-capitol { position: absolute; left: 1320px; top: 270px; width: 380px; height: 150px; }
    #money-arm { position: absolute; left: 1040px; top: 410px; }
    #money .bucket { position: absolute; top: 644px; width: 360px; height: 186px; }
    #money .lab { position: absolute; top: 844px; width: 360px; text-align: center; }
  </style>

  <div id="money" class="world" data-composition-id="money" data-width="1920" data-height="1080">
    <div class="kicker" id="money-kick">Why it matters</div>
    <div id="money-one">1</div>
    <div class="credit" id="money-credit" data-layout-ignore>U.S. Constitution, Article I, Section 9<br>bucket heights are illustrative</div>

    <!-- where scene 5 ended: the 2026 ballot with the school board marked, and the school -->
    <div class="ballot" id="money-ob">
      <div id="money-ob-year">2026</div>
      <div id="money-ob-hrule"></div>
      <div id="money-ob-rules" data-layout-ignore></div>
      <div id="money-ob-band"></div>
      <div id="money-ob-div"></div>
    </div>
    <div id="money-school" data-layout-allow-overlap>
      <!-- the same school scene 5 ends on: white building, ink outline, ink windows -->
      <svg id="money-building" width="320" height="300" viewBox="0 0 320 300" style="position:absolute;left:20px;top:80px">
        <rect x="28" y="100" width="264" height="200" rx="14" style="fill:var(--ground-2);stroke:var(--chalk)" stroke-width="7"/>
        <path d="M 8 104 L 160 16 L 312 104 Z" style="fill:var(--ground-2);stroke:var(--chalk)" stroke-width="7" stroke-linejoin="round"/>
        <circle cx="160" cy="66" r="18" fill="none" style="stroke:var(--chalk)" stroke-width="6"/>
        <path d="M 160 55 L 160 66 L 169 73" fill="none" style="stroke:var(--chalk)" stroke-width="5" stroke-linecap="round"/>
        <rect x="62" y="128" width="60" height="52" rx="10" style="fill:var(--chalk);stroke:var(--chalk)" stroke-width="5"/>
        <rect x="198" y="128" width="60" height="52" rx="10" style="fill:var(--chalk);stroke:var(--chalk)" stroke-width="5"/>
        <rect x="131" y="188" width="58" height="112" rx="10" style="fill:var(--chalk);stroke:var(--chalk)" stroke-width="5"/>
      </svg>
      <div id="money-ground"></div>
      <svg id="money-link" width="150" height="380" viewBox="0 0 150 380" style="position:absolute;left:2px;top:380px">
        <path d="M 6 342 C 74 330, 14 140, 122 22" fill="none" style="stroke:var(--local)" stroke-width="9" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- the law Congress writes -->
    <div class="card" id="money-card" data-layout-allow-overlap>
      <span id="money-cardtxt">Law</span>
      <svg id="money-seal" width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" style="fill:var(--you)"/>
        <path d="M 34 62 l 17 18 l 35 -42" fill="none" style="stroke:var(--chalk)" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>

    </div>
    <div id="money-crowd"></div>

    <!-- the treasury, its gate, and the rule that keeps the gate shut -->
    <div class="jar" id="money-jar" data-layout-allow-overlap></div>
    <svg id="money-funnel" width="260" height="110" viewBox="0 0 260 110">
      <path d="M 10 4 L 250 4 L 150 106 L 110 106 Z" style="fill:var(--money);fill-opacity:.10;stroke:var(--money)"
        stroke-width="6" stroke-linejoin="round"/>
    </svg>
    <div class="post" id="money-post-l"></div>
    <div class="post" id="money-post-r"></div>
    <div class="leaf" id="money-gate-l"></div>
    <div class="leaf" id="money-gate-r"></div>
    <div class="label" id="money-rulelab">The rule</div>
    <svg id="money-scroll" width="170" height="190" viewBox="0 0 170 190">
      <rect x="25" y="22" width="120" height="146" rx="9" style="fill:var(--ground-2);stroke:var(--chalk)" stroke-width="4"/>
      <g style="stroke:var(--chalk-2)" stroke-width="7" stroke-linecap="round">
        <path d="M 47 60 L 124 60"/><path d="M 47 85 L 124 85"/><path d="M 47 110 L 108 110"/>
      </g>
      <circle cx="117" cy="141" r="15" style="fill:var(--you)"/>
      <rect x="11" y="6" width="148" height="27" rx="13" style="fill:var(--ground);stroke:var(--chalk)" stroke-width="4"/>
      <rect x="11" y="157" width="148" height="27" rx="13" style="fill:var(--ground);stroke:var(--chalk)" stroke-width="4"/>
    </svg>

    <!-- Congress, with its hand on the gate -->
    <div id="money-capitol"></div>
    <svg id="money-arm" width="340" height="200" viewBox="0 0 340 200">
      <path id="money-arm-path" d="M 310 16 C 250 60, 150 140, 44 178" pathLength="1" fill="none"
        style="stroke:var(--you);stroke-dasharray:1 1.2;stroke-dashoffset:1.1"
        stroke-width="13" stroke-linecap="round"/>
      <circle id="money-hand" cx="32" cy="182" r="20" style="fill:var(--you)"/>
    </svg>
  </div>

  <script>
    (function () {
      const S = window.__storyshot;
      // the wrapper HyperFrames mounts into carries the same id as the scene root, so find the
      // real root through a child of it: anything appended to the wrapper misses the scene's CSS
      const crowd = document.getElementById('money-crowd');
      const root = crowd.parentElement;
      const mk = (cls, css, html) => {
        const d = document.createElement('div');
        d.className = cls; d.style.cssText = css; if (html) d.innerHTML = html;
        root.appendChild(d); return d;
      };

      // --- the ballot scene 5 ends on, redrawn in its final state so the cut lands on it -------
      const OB = document.getElementById('money-ob'), OBR = document.getElementById('money-ob-rules');
      const OBTICK = '<svg viewBox="0 0 24 24" width="28" height="28"><path d="M4 12.5 l5.5 5.5 l10.5 -14"'
        + ' fill="none" style="stroke:var(--chalk)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      [
        { top: 182, rule: 236, text: 'U.S. House', count: String(Kit.Y2026.house), tint: 'var(--house)' },
        { top: 266, rule: 320, text: 'U.S. Senate', count: String(Kit.Y2026.senate), tint: 'var(--senate)' },
        { top: 350, rule: 404, text: 'Governor', count: String(Kit.Y2026.governors), unit: 'states', tint: 'var(--local)' },
        { top: 448, rule: 502, text: 'State lawmakers' },
        { top: 532, rule: 586, text: 'Mayor' },
        { top: 616, rule: 670, text: 'Judges' },
        { top: 700, rule: 746, text: 'School board', mark: true },
      ].forEach((r) => {
        OBR.insertAdjacentHTML('beforeend', '<div class="gr" style="top:' + r.rule + 'px"></div>');
        // the marked row lies on the solid --local band, so its ink is the sheet's own white
        OB.insertAdjacentHTML('beforeend', '<div class="brow" style="top:' + r.top + 'px;left:50px;width:980px'
          + (r.mark ? ';color:var(--ground-2)' : '') + '">'
          + '<span class="box" style="' + (r.tint ? 'background:' + r.tint + ';border-color:' + r.tint : r.mark ? 'border-color:var(--chalk)' : '') + '">'
          + (r.mark ? OBTICK : '') + '</span><span>' + r.text + '</span>'
          + (r.count ? '<span class="cnt" style="margin-left:auto">' + r.count + '</span>' : '')
          + (r.unit ? '<span class="unit">' + r.unit + '</span>' : '') + '</div>');
      });
      Kit.person(document.getElementById('money-school'), { x: 180, y: 380, h: 104, cls: 'on' });

      // --- a law is for everybody: seven people, each with a copy of it ------------------------
      const CX = [100, 320, 540, 760, 980, 1200, 1420];           // inside #money-crowd
      const folk = CX.map((x) => Kit.person(crowd, { x: x, y: 180, h: 150 }));
      const copies = CX.map((x, k) => {
        const d = mk('card copy', 'left:' + (240 + x - 85) + 'px', 'Law<i></i>');
        d.id = 'money-copy-' + k;
        return d;
      });

      // --- the treasury jar, full of coins ------------------------------------------------------
      const jar = document.getElementById('money-jar');
      const rnd = Kit.rng(7), jarCoins = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < (r % 2 ? 6 : 7); c++) {
        const d = document.createElement('div');
        d.className = 'coin';
        d.style.cssText = 'left:' + (30 + (r % 2 ? 67 : 30) + c * 74 + (rnd() - 0.5) * 14) + 'px;top:'
          + (150 + r * 66 + (rnd() - 0.5) * 10) + 'px;width:64px;height:64px';
        jar.appendChild(d);
        jarCoins.push(d);
      }

      // --- what the money pays for: four buckets. The levels are illustrative (see the credit) --
      const BUCKETS = [
        { x: 100, text: 'Roads', fill: 0.62 },
        { x: 553, text: 'Parks', fill: 0.30 },
        { x: 1006, text: 'School lunches', fill: 0.46 },
        { x: 1459, text: 'The army', fill: 0.80 },
      ];
      const SHAPE = 'M 34 12 L 326 12 L 286 156 Q 180 176 74 156 Z';
      const INNER = 152, BASE = 166;
      BUCKETS.forEach((b, k) => {
        const d = mk('bucket', 'left:' + b.x + 'px',
          '<svg width="360" height="186" viewBox="0 0 360 186">'
          + '<defs><clipPath id="money-clip-' + k + '"><path d="' + SHAPE + '"/></clipPath></defs>'
          + '<rect class="fl" x="24" y="' + BASE + '" width="312" height="0" style="fill:var(--money)" clip-path="url(#money-clip-' + k + ')"/>'
          + '<path d="' + SHAPE + '" fill="none" style="stroke:var(--money)" stroke-width="8" stroke-linejoin="round"/>'
          + '<rect x="16" y="0" width="328" height="16" rx="8" style="fill:var(--money)"/></svg>');
        d.id = 'money-bucket-' + k;
        const l = mk('label lab', 'left:' + b.x + 'px', b.text);
        l.id = 'money-lab-' + k;
        b.el = d; b.lab = l; b.rect = d.querySelector('.fl');
      });

      document.getElementById('money-capitol').innerHTML =
        Kit.CAPITOL_SVG.replace('width="760" height="300"', 'width="380" height="150"');

      const tl = gsap.timeline({ paused: true });

      // (0)(1) the reason, numbered
      tl.fromTo('#money-kick', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, S.at(0));
      tl.fromTo('#money-one', { opacity: 0, scale: 0.3, transformOrigin: 'center center' },
        { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2.2)' }, S.at(1));

      // (0) the school lets go of the ballot it was tied to; (1) the ballot draws in to where
      // the law will be; (2) it becomes the law those rows send people to Congress to write
      tl.fromTo('#money-school', { opacity: 1 }, { opacity: 0, duration: 0.5, ease: 'power1.in' }, S.at(0, 0.2));
      tl.fromTo('#money-ob', { scale: 1, y: 0, transformOrigin: 'center center' },
        { scale: 0.72, y: -170, duration: 0.9, ease: 'expo.inOut' }, S.at(1, 0.1));
      tl.fromTo('#money-ob', { opacity: 1 }, { opacity: 0, duration: 0.32, ease: 'power1.in' }, S.at(2));
      tl.fromTo('#money-card', { opacity: 0, scale: 1.28, y: 90, transformOrigin: 'center center' },
        { opacity: 1, scale: 1.66, y: 90, duration: 0.55, ease: 'expo.out' }, S.at(2));
      tl.fromTo('#money-seal', { opacity: 0, scale: 2.6, rotation: -22, transformOrigin: 'center center' },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: 'back.out(1.6)' }, S.at(2, 0.72));
      tl.fromTo('#money-cardtxt', { y: 0 }, { y: 10, duration: 0.09, ease: 'power2.out' }, S.at(2, 1.0));
      tl.fromTo('#money-cardtxt', { y: 10 }, { y: 0, duration: 0.45, ease: 'elastic.out(1,0.45)' }, S.at(2, 1.09));

      // (3) and a law is for everybody: the card shrinks, a copy lands over each person
      tl.fromTo('#money-card', { scale: 1.66, y: 90 },
        { scale: 1, y: 0, duration: 0.7, ease: 'expo.out' }, S.at(3));
      folk.forEach((p, k) => {
        tl.fromTo(p, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, S.at(3, 0.05 + k * 0.04));
      });
      copies.forEach((c, k) => {
        tl.fromTo(c, { opacity: 0, scale: 0.88, x: 960 - (240 + CX[k]), y: -230, transformOrigin: 'center center' },
          { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.55, ease: 'expo.out' }, S.at(3, 0.25 + k * 0.04));
      });

      // (4) and Congress holds the money: the law clears, the treasury lands
      tl.fromTo(['#money-card', '#money-crowd'], { opacity: 1 }, { opacity: 0, duration: 0.4 }, S.at(4));
      copies.forEach((c) => tl.fromTo(c, { opacity: 1 }, { opacity: 0, duration: 0.4 }, S.at(4)));
      tl.fromTo('#money-jar', { opacity: 0, scale: 0.55, y: -40, transformOrigin: '50% 100%' },
        { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: 'expo.out' }, S.at(4, 0.2));
      tl.fromTo(jarCoins, { opacity: 0, scale: 0.4, transformOrigin: 'center center' },
        { opacity: 1, scale: 1, duration: 0.4, stagger: 0.025, ease: 'back.out(2)' }, S.at(4, 0.45));

      // (5) money can only leave if Congress says so: the spout, the shut gate, the rule beside it
      tl.fromTo('#money-credit', { opacity: 0 }, { opacity: 1, duration: 0.5 }, S.at(5, 0.3));
      tl.fromTo('#money-funnel', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, S.at(5));
      tl.fromTo(['#money-post-l', '#money-post-r'], { opacity: 0, scaleY: 0.2, transformOrigin: 'center top' },
        { opacity: 1, scaleY: 1, duration: 0.45, ease: 'expo.out' }, S.at(5, 0.35));
      tl.fromTo('#money-gate-l', { opacity: 0, scaleX: 0.08, transformOrigin: 'left center' },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: 'expo.out' }, S.at(5, 0.5));
      tl.fromTo('#money-gate-r', { opacity: 0, scaleX: 0.08, transformOrigin: 'right center' },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: 'expo.out' }, S.at(5, 0.5));
      tl.fromTo('#money-scroll', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.55, ease: 'expo.out' }, S.at(5, 0.95));
      tl.fromTo('#money-rulelab', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, S.at(5, 1.1));

      // two coins come down the spout and are stopped by the shut gate
      const wait = [936, 972].map((x, k) => {
        const d = mk('coin', 'left:' + x + 'px;top:536px;width:36px;height:36px');
        d.id = 'money-wait-' + k;
        return d;
      });
      wait.forEach((w, k) => {
        tl.fromTo(w, { opacity: 0, y: -56 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.in' }, S.at(5, 1.6 + k * 0.5));
      });

      // (6)(7)(8)(9) the gate opens and the money runs into one bucket per phrase
      tl.fromTo('#money-gate-l', { x: 0 }, { x: -112, duration: 0.55, ease: 'power3.inOut' }, S.at(6, -0.3));
      tl.fromTo('#money-gate-r', { x: 0 }, { x: 112, duration: 0.55, ease: 'power3.inOut' }, S.at(6, -0.3));
      wait.forEach((w, k) => {
        tl.fromTo(w, { x: 0 }, { x: (k ? 733 : 280) - (954 + k * 36), duration: 0.85, ease: 'none' }, S.at(6, 0.12));
        tl.fromTo(w, { y: 0 }, { y: 150, duration: 0.85, ease: 'power2.in' }, S.at(6, 0.12));
        tl.fromTo(w, { opacity: 1 }, { opacity: 0, duration: 0.2 }, S.at(6, 0.8));
      });

      let coins = 0;
      BUCKETS.forEach((b, k) => {
        const cue = S.at(6 + k, k === 0 ? 0.05 : 0);
        tl.fromTo(b.el, { opacity: 0, y: 40, scale: 0.7, transformOrigin: '50% 100%' },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'expo.out' }, cue);
        tl.fromTo(b.lab, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, cue + 0.16);
        // a first splash of coins, then (10) the levels they really settle at
        tl.fromTo(b.rect, { attr: { y: BASE, height: 0 } },
          { attr: { y: BASE - INNER * 0.2, height: INNER * 0.2 }, duration: 0.5, ease: 'power2.out' }, cue + 0.8);
        tl.fromTo(b.rect, { attr: { y: BASE - INNER * 0.2, height: INNER * 0.2 } },
          { attr: { y: BASE - INNER * b.fill, height: INNER * b.fill }, duration: 1.1, ease: 'power2.out' }, S.at(10, k * 0.13));
        for (let i = 0; i < 16; i++) {
          const t = cue + 0.6 + i * 0.45 + k * 0.11;
          if (t + 1.0 > S.duration - 0.2) break;
          const c = mk('coin', 'left:940px;top:540px;width:38px;height:38px');
          c.id = 'money-coin-' + (coins++);
          tl.fromTo(c, { x: 0 }, { x: b.x + 180 - 959, duration: 0.9, ease: 'none' }, t);
          tl.fromTo(c, { y: 0 }, { y: 150, duration: 0.9, ease: 'power2.in' }, t);
          tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.14 }, t);
          tl.fromTo(c, { opacity: 1 }, { opacity: 0, duration: 0.2 }, t + 0.74);
        }
      });

      // (11) and that somebody is Congress
      tl.fromTo('#money-capitol', { opacity: 0, scale: 0.7, y: -34, transformOrigin: '50% 100%' },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: 'expo.out' }, S.at(11));
      tl.fromTo('#money-arm-path', { strokeDashoffset: 1.1 },
        { strokeDashoffset: 0, duration: 0.6, ease: 'power2.inOut', autoRound: false }, S.at(11, 0.4));
      tl.fromTo('#money-hand', { opacity: 0, scale: 0.2, transformOrigin: 'center center' },
        { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2.4)' }, S.at(11, 0.9));

      window.__timelines['money'] = tl;
    })();
  </script>
</template>
