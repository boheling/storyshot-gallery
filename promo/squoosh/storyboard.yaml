name: squoosh-promo
url: https://squoosh.app/
purpose: pitch
out: squoosh-promo.mp4

intro:
  title: "Squoosh"
  subtitle: Shrink images **right in your browser**

setup:
  - dismiss: { role: "button", name: "DISMISS" }

steps:
  - caption: Drop in any image, or **try a demo**
    captionPosition: top
    duration: 2.4
    zoom: { target: { x: 800, y: 700 }, scale: 1.3, start: 0.6, end: 2.6, ramp: [0.6, 0.3] }
    actions:
      - move: { x: 0.5, y: 0.42, ms: 700 }
      - pause: 300
      - click: { alt: "Large photo", exact: true, ms: 800 }

  - hidden: true
    actions:
      - waitFor: { text: "862", timeout: 30000 }
      - pause: 800

  - caption: Drag to compare **before / after**
    duration: 2.8
    actions:
      - drag: { from: { x: 800, y: 450 }, by: [{ x: -380 }, { x: 560 }, { x: -180 }] }

  - caption: Switch the codec to **WebP**
    duration: 2.6
    zoom: { target: { css: "select._builtin-select_1onzk_5._large_1onzk_29", nth: 1 }, scale: 1.7, start: 0.1, ramp: [0.5, 0.4] }
    actions:
      - select: { target: { css: "select._builtin-select_1onzk_5._large_1onzk_29", nth: 1 }, option: "WebP" }
      - pause: 500

  - caption: Set quality to **60**
    duration: 2.6
    zoom: { target: { css: "input[type=range]", nth: 1 }, scale: 2.2, start: 0.0, ramp: [0.4, 0.4] }
    actions:
      - slide: { target: { css: "input[type=range]", nth: 1 }, to: 0.594 }
      - pause: 400

  - hidden: true
    actions:
      - waitFor: { text: "509", timeout: 30000 }
      - pause: 500

  - caption: "Original: **2.79 MB**"
    captionPosition: top
    duration: 2.2
    zoom: { target: { x: 140, y: 852 }, scale: 3.0, start: 0.0, ramp: [0.5, 0.3] }
    actions:
      - move: { x: 420, y: 700, ms: 600 }
      - mark: "2.79 MB"
      - pause: 600

  - caption: "WebP: **509 kB, 82% smaller**"
    captionPosition: top
    duration: 2.4
    zoom: { target: { x: 1440, y: 860 }, scale: 3.0, start: 0.0, ramp: [0.5, 0.4] }
    actions:
      - move: { x: 1150, y: 700, ms: 600 }
      - mark: "509"
      - pause: 700

  - caption: Up close, **hard to tell apart**
    duration: 2.8
    zoom: { target: { x: 700, y: 270 }, scale: 1.5, start: 0.2, ramp: [0.5, 0.4] }
    actions:
      - drag: { from: { x: 800, y: 450 }, by: [{ x: -170 }, { x: 140 }, { x: -90 }] }

end_card:
  title: "Squoosh"
  subtitle: Free, private, **no upload needed**
  cta: "Try it at squoosh.app"
