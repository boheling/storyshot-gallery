name: cli-promo
url: https://cli.im/url
purpose: pitch
out: cli-promo.mp4
voice: { provider: say, voice: Tingting }
theme: { accent: "#1fb35c" }
music: { bpm: 112, volume: 0.8 }

intro:
  title: "草料二维码"
  subtitle: "网址一贴，**马上出码**"
  say: "草料二维码。"
  duration: 2.5

setup:
  - hide: '.cli-kefu, [class*="assistant"], [class*="float"]'

steps:
  - caption: "粘贴你的**网址**"
    say: "粘贴一个网址，"
    duration: 2.5
    captionPosition: top
    zoom: { target: { x: 420, y: 215 }, scale: 2.2, start: 0.0, ramp: [0.5, 0.4] }
    actions:
      - click: { role: "textbox", name: "http://", exact: true }
      - paste: "https://example.com"
      - pause: 500

  - caption: "一键**生成二维码**"
    say: "点击生成，二维码马上出现。"
    duration: 3
    zoom: { target: { x: 1222, y: 330 }, scale: 1.35, start: 0.9, ramp: [0.6, 0.4] }
    actions:
      - click: { role: "button", name: "生成二维码", exact: true }
      - networkIdle: true
      - pause: 800

  - caption: "还能**美化**"
    say: "还能一键美化，"
    duration: 1.8
    zoom: { target: { x: 1303, y: 480 }, scale: 1.4, start: 0.0, ramp: [0.5, 0.3] }
    actions:
      - click: { role: "button", name: "二维码美化", exact: true }
      - pause: 300

  - hidden: true
    actions:
      - goto: https://mh.cli.im/
      - networkIdle: true
      - paste: { target: { role: "textbox", name: "请输入二维码编码内容", exact: true }, text: "https://example.com" }
      - click: { role: "button", name: "生成二维码", exact: true }
      - networkIdle: true
      - pause: 1000

  - caption: "选一个**样式**"
    say: "选一个喜欢的样式，"
    duration: 2.2
    actions:
      - click: { alt: "简约渐变", exact: true }
      - pause: 300
      - waitFor: { text: "当前样式", timeout: 30000 }

  - caption: "渐变配色，**秒变好看**"
    say: "颜色和码点，立刻焕然一新。"
    duration: 3.5
    zoom: { target: { x: 1204, y: 440 }, scale: 1.45, start: 0.0, ramp: [0.7, 0.5] }
    actions:
      - move: { x: 1450, y: 760, ms: 1200 }
      - pause: 1500

end_card:
  title: "草料二维码"
  subtitle: "免费生成，**一键美化**"
  cta: "立即访问 cli.im"
  say: "草料二维码，免费生成，一键美化。"
