# Storyshot storyboard (course): how a regular expression matches text, live on regex101
name: regex101-lesson-quantifiers
url: https://regex101.com/
purpose: course
hyperframes: true
out: regex101-lesson-quantifiers.mp4
voice:
  provider: kokoro
  pronounce: { regex: rejex, regex101: rejex one-oh-one }
subtitles: true
chapters: true

intro:
  kicker: Lesson
  title: How a regex matches text
  subtitle: Watch it happen live in **regex101**
  bullets:
    - Literal characters match themselves
    - "\\d matches any one digit"
    - "+ and {3} say how many"
  say: In this lesson you'll see why a regular expression matches some text and not other text. We'll use three building blocks, literal characters, the digit class, and quantifiers, and test each one live.

setup:
  - pause: 1500
  - click: { x: 1551, y: 788 }        # close the "new version" toast
  - click: { x: 600, y: 230 }         # test string editor
  - type: "The cat sat on the mat.\nCats nap. Concatenate!\nRoom 7, call 555-0199, zip 94110."
  - click: { role: "textbox", name: "Insert your regular expression here", exact: true }
  - type: "a"                         # warm up the regex engine (first pattern otherwise never finishes processing)
  - pause: 6000
  - press: Backspace
  - pause: 1000

steps:
  - card:
      kicker: Part 1
      title: Literal characters
      subtitle: Each plain letter must match **exactly that character**
      image: literal-scan.svg
      say: A plain letter in a pattern is called a literal. The engine slides the pattern along the text, and at every position it compares one character at a time. If every character is equal, that's a match. If one differs, it gives up there and moves one step to the right.
    caption: The test text
    say: This is regex101. The big box holds our test text, three short lines with some words, a room number, a phone number and a zip code.
    actions:
      - move: { x: 440, y: 245, ms: 1200, highlight: true }
      - pause: 600

  - caption: The pattern box
    say: The box at the top holds the pattern. Let's start with three plain letters, c, a, t.
    actions:
      - click: { role: "textbox", name: "Insert your regular expression here", exact: true }
      - type: "cat"
      - pause: 1500

  - caption: "**2 matches**, not 3"
    say: Two matches. The cat in line one, and the middle of Concatenate. A regex doesn't know about words, it only sees characters, so cat inside a longer word still counts.
    actions:
      - mark: "2 matches"
      - mark: "Concatenate"

  - caption: Why does **Cats** fail?
    say: But Cats on line two is not matched. Its first character is an uppercase C, and the pattern asks for a lowercase c. One mismatched character is enough to fail. regex101 even says so on the right, the literal text cat, case sensitive.
    actions:
      - move: { x: 318, y: 246, ms: 1000, highlight: true }
      - pause: 2500
      - mark: "case sensitive"

  - card:
      kicker: Part 2
      title: "Character classes: \\d"
      subtitle: One position, **many allowed characters**
    caption: "Type \\d"
    say: Now let's replace the pattern with backslash d. Backslash d is a character class. It means, any single digit, from zero to nine.
    actions:
      - click: { role: "textbox", name: "Insert your regular expression here", exact: true }
      - press: Meta+A
      - type: "\\d"
      - pause: 1500

  - caption: "**13 matches**, one per digit"
    say: Thirteen matches, one for every digit in the text. Look closely, each match is a single character. A class accepts many different characters, but it still fills only one position. So five five five is three separate matches, not one.
    zoom: { target: { x: 470, y: 255 }, scale: 1.7, start: 0.5 }
    actions:
      - mark: "13 matches"
      - move: { x: 470, y: 269, ms: 1000 }

  - card:
      kicker: Part 3
      title: Quantifiers
      subtitle: "**+** means one or more, **{3}** means exactly three"
    caption: Add a **+**
    say: To match a whole number, we add a quantifier after the class. Plus means, one or more of the thing just before it.
    actions:
      - click: { role: "textbox", name: "Insert your regular expression here", exact: true }
      - press: End
      - type: "+"
      - pause: 1500

  - caption: "**4 matches**: whole numbers"
    say: Now there are four matches. Seven, five five five, zero one nine nine, and nine four one one zero. Plus is greedy. It keeps taking digits for as long as it can, and stops at the first character that isn't a digit, like the dash or the comma.
    zoom: { target: { x: 470, y: 255 }, scale: 1.7, start: 0.5 }
    actions:
      - mark: "4 matches"
      - move: { x: 470, y: 269, ms: 1000 }

  - card:
      kicker: Check your understanding
      title: "How many matches will \\d{3} find?"
      subtitle: "Curly braces **{3}** mean exactly three"
      image: question.svg
      think: 5
      say: Next we'll change the plus to curly brace three, which means exactly three digits. Before we run it, how many matches will it find in this line, and which ones? Pause and think.
    caption: "Change **+** to **{3}**"
    say: Let's check. Delete the plus and type the three in curly braces.
    actions:
      - click: { role: "textbox", name: "Insert your regular expression here", exact: true }
      - press: End
      - press: Backspace
      - type: "{3}"
      - pause: 1500

  - caption: "**3 matches**: 555, 019, 941"
    say: Three matches. Five five five. Then zero one nine. Then nine four one. Did you expect zero one nine nine, or nine four one one zero? A quantifier with a fixed count takes exactly three, no more.
    zoom: { target: { x: 470, y: 255 }, scale: 1.7, start: 0.5 }
    actions:
      - mark: "3 matches"
      - move: { x: 449, y: 269, ms: 1000 }   # hover "019": regex101 tooltip shows Match 2
      - pause: 4000
      - move: { x: 471, y: 269, ms: 600 }    # leftover 9: no tooltip, not matched
      - pause: 3000

  - card:
      kicker: Why
      title: Matches never overlap
      image: answer.svg
      say: Here's why. Seven alone is too short, so it never matches. In zero one nine nine, the engine takes zero one nine, and the search continues right after it. The single nine that's left over is not three digits. The same thing happens in the zip code, where one zero is left over.
    caption: The explanation panel agrees
    say: The explanation panel on the right reads the pattern back to you. A digit, repeated exactly three times. Reading it is a good habit whenever a match surprises you.
    actions:
      - mark: "repeated exactly 3 times"

  - caption: "Put it together: **\\d{3}-\\d{4}**"
    say: Finally, combine all three ideas. Three digits, a literal dash, then four digits.
    actions:
      - click: { role: "textbox", name: "Insert your regular expression here", exact: true }
      - press: End
      - type: "-\\d{4}"
      - pause: 1500

  - caption: "**1 match**: the phone number"
    say: One match, the phone number. The zip code has digits too, but no dash after three of them, so the literal dash fails there.
    zoom: { target: { x: 470, y: 255 }, scale: 1.7, start: 0.5 }
    actions:
      - mark: "1 match"
      - move: { x: 470, y: 269, ms: 1000 }

end_card:
  title: Remember
  bullets:
    - A literal matches exactly that character, case included
    - "\\d matches one digit, in one position"
    - "+ takes as many as it can; {3} takes exactly 3"
    - Matches go left to right and never overlap
  cta: Practice at regex101.com
  say: To recap. A literal matches exactly that character. Backslash d matches one digit in one position. Plus takes as many as it can, curly three takes exactly three. And matches go left to right, never overlapping. Try your own patterns at regex101 dot com.
